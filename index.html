<style>
/* ============================================================
   DESIGN TOKENS
   Espacement sur base 4px · échelle typographique · élévations
   Contrastes vérifiés AA (4.5:1 texte, 3:1 composants)
   ============================================================ */
:root{
  /* espacement */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  /* rayons */
  --r1:8px; --r2:12px; --r3:16px; --r4:20px; --r-full:999px;
  /* typographie */
  --fs-xs:12px; --fs-sm:14px; --fs-base:16px; --fs-md:17px; --fs-lg:20px;
  --fs-xl:24px; --fs-2xl:30px;
  /* couleurs — thème clair */
  --bg:#f5f5f2; --surface:#ffffff; --surface-2:#faf9f7; --surface-3:#f0efec;
  --ink:#16161a; --ink-2:#56565f; --ink-3:#7c7c86;
  --line:#e3e2de; --line-strong:#cbcac5;
  --p:#4f46e5; --p-ink:#3730a3; --p-soft:#eef1ff; --p-line:#c7cdfd;
  --ok:#15803d; --ok-ink:#14532d; --ok-soft:#f0fdf5; --ok-line:#86efac;
  --ko:#b91c1c; --ko-ink:#7f1d1d; --ko-soft:#fef3f2; --ko-line:#fca5a5;
  --gold:#b45309; --gold-soft:#fffbeb; --gold-line:#fcd34d;
  --code-bg:#1e2330; --code-ink:#e8eaf0;
  --focus:#1d4ed8;
  --sh1:0 1px 2px rgba(16,16,24,.06);
  --sh2:0 2px 8px rgba(16,16,24,.07);
  --sh3:0 8px 28px rgba(16,16,24,.10);
  --depth:#c9c8c3;            /* épaisseur sous les boutons */
  --p-depth:#3730a3;
  --ok-depth:#166534;
}
[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a21; --surface-2:#1c2029; --surface-3:#242935;
  --ink:#f2f3f5; --ink-2:#a7abb5; --ink-3:#868c98;
  --line:#2a2f3a; --line-strong:#3a4150;
  --p:#8b93f8; --p-ink:#c7cdfd; --p-soft:#1c1f3d; --p-line:#3d3f7a;
  --ok:#4ade80; --ok-ink:#bbf7d0; --ok-soft:#0d2317; --ok-line:#166534;
  --ko:#f87171; --ko-ink:#fecaca; --ko-soft:#2a1315; --ko-line:#7f1d1d;
  --gold:#fbbf24; --gold-soft:#2a2010; --gold-line:#78350f;
  --code-bg:#0b0d12; --code-ink:#e8eaf0;
  --focus:#93c5fd;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 2px 10px rgba(0,0,0,.45);
  --sh3:0 10px 32px rgba(0,0,0,.55);
  --depth:#0a0c10; --p-depth:#3f45a8; --ok-depth:#166534;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#171a21; --surface-2:#1c2029; --surface-3:#242935;
    --ink:#f2f3f5; --ink-2:#a7abb5; --ink-3:#868c98;
    --line:#2a2f3a; --line-strong:#3a4150;
    --p:#8b93f8; --p-ink:#c7cdfd; --p-soft:#1c1f3d; --p-line:#3d3f7a;
    --ok:#4ade80; --ok-ink:#bbf7d0; --ok-soft:#0d2317; --ok-line:#166534;
    --ko:#f87171; --ko-ink:#fecaca; --ko-soft:#2a1315; --ko-line:#7f1d1d;
    --gold:#fbbf24; --gold-soft:#2a2010; --gold-line:#78350f;
    --code-bg:#0b0d12; --focus:#93c5fd;
    --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 2px 10px rgba(0,0,0,.45);
    --sh3:0 10px 32px rgba(0,0,0,.55);
    --depth:#0a0c10; --p-depth:#3f45a8;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:var(--fs-base);line-height:1.6;
  transition:background .25s,color .25s;
}
#app{max-width:760px;margin:0 auto;padding:0 var(--s4) calc(var(--s8) + env(safe-area-inset-bottom))}

/* focus visible — 3:1 minimum, jamais supprimé */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
:focus:not(:focus-visible){outline:none}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- barre supérieure ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:var(--s3) 0 var(--s3);display:flex;align-items:center;gap:var(--s3);
  border-bottom:1px solid var(--line);margin-bottom:var(--s5);
  transition:background .25s,border-color .25s;
}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:var(--fs-sm);
  color:var(--ink);white-space:nowrap}
.stat .n{font-variant-numeric:tabular-nums}
.stat small{font-weight:500;color:var(--ink-2);font-size:var(--fs-xs)}
.spacer{flex:1}
.iconbtn{
  width:44px;height:44px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;font-size:17px;
  display:grid;place-items:center;flex-shrink:0;transition:background .15s,border-color .15s;
}
.iconbtn:hover{background:var(--surface-3);border-color:var(--line-strong)}

/* ---------- boutons ---------- */
.btn{
  border:none;border-radius:var(--r2);padding:14px 22px;font-size:15px;font-weight:650;
  cursor:pointer;font-family:inherit;min-height:48px;line-height:1.2;
  transition:transform .08s ease,filter .15s,background .15s;
}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn-p{background:var(--p);color:#fff;box-shadow:0 3px 0 var(--p-depth)}
.btn-p:active:not(:disabled){box-shadow:0 1px 0 var(--p-depth)}
.btn-p:hover:not(:disabled){filter:brightness(1.08)}
.btn-g{background:var(--ok);color:#fff;box-shadow:0 3px 0 var(--ok-depth)}
[data-theme="dark"] .btn-g,[data-theme="dark"] .btn-p{color:#0e1014}
.btn-g:active:not(:disabled){box-shadow:0 1px 0 var(--ok-depth)}
.btn-sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--sh1)}
.btn-sec:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;color:var(--ink-2);font-weight:550;padding:12px 14px}
.btn-ghost:hover{color:var(--ink);background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- accueil ---------- */
.hero{
  background:linear-gradient(135deg,#4f46e5 0%,#6d28d9 55%,#7c3aed 100%);
  color:#fff;border-radius:var(--r4);padding:var(--s5) var(--s5);
  margin-bottom:var(--s5);display:flex;align-items:center;gap:var(--s5);
  box-shadow:var(--sh2)
}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#312e81 0%,#4c1d95 55%,#5b21b6 100%)}
.hero-txt{flex:1;min-width:0}
.hero h1{margin:0 0 2px;font-size:var(--fs-xl);letter-spacing:-.02em;line-height:1.2}
.hero p{margin:0;opacity:.92;font-size:var(--fs-sm)}
.ring{width:82px;height:82px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .lab b{font-size:19px;display:block}
.ring .lab small{font-size:10px;opacity:.85;letter-spacing:.05em;text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4) var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh1)}
.resume{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.resume .txt{flex:1;min-width:180px}
.resume .k{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;
  color:var(--p);font-weight:700;margin-bottom:2px}
.resume h3{margin:0;font-size:var(--fs-md)}
.resume p{margin:2px 0 0;color:var(--ink-2);font-size:var(--fs-sm)}

.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4) var(--s5) var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh1);
  transition:border-color .2s}
.unit-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.badge{width:44px;height:44px;border-radius:var(--r2);display:grid;place-items:center;
  font-size:20px;flex-shrink:0}
.unit h3{margin:0;font-size:var(--fs-md);letter-spacing:-.01em}
.unit .desc{margin:1px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.uprog{display:flex;align-items:center;gap:var(--s2);margin-left:auto;flex-shrink:0}
.uprog .track{width:52px;height:6px;background:var(--line);border-radius:var(--r-full);overflow:hidden}
.uprog .track>i{display:block;height:100%;background:var(--ok);border-radius:var(--r-full);
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.uprog span{font-size:var(--fs-xs);color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}

.nodes{display:flex;flex-wrap:wrap;gap:var(--s2)}
.node{
  border:1.5px solid var(--line-strong);background:var(--surface);border-radius:var(--r2);
  padding:11px 15px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;color:var(--ink);
  display:inline-flex;align-items:center;gap:8px;font-family:inherit;min-height:44px;
  transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;
}
.node:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh2)}
.node .dot{width:9px;height:9px;border-radius:var(--r-full);background:var(--line-strong);flex-shrink:0}
.node.done{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
[data-theme="dark"] .node.done{color:var(--ok)}
.node.done .dot{background:var(--ok)}
.node.done .pc{font-weight:700;font-variant-numeric:tabular-nums;opacity:.8}
.node.cours{background:var(--p-soft);border-color:var(--p-line);color:var(--p-ink)}
.node.cours .dot{background:var(--p)}
.node.cours.read{background:var(--surface);border-color:var(--line);color:var(--ink-2);font-weight:550}
.node.cours.read .dot{background:var(--line-strong)}
.node.next{position:relative;border-color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}

.review{background:var(--gold-soft);border-color:var(--gold-line)}

/* ---------- vue cours ---------- */
.readbar{position:fixed;top:0;left:0;height:3px;background:var(--p);z-index:40;
  width:0;transition:width .1s linear}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s6) var(--s5);box-shadow:var(--sh1)}
.course h2{margin:0 0 var(--s1);font-size:var(--fs-2xl);letter-spacing:-.02em;line-height:1.2}
.course .lead{color:var(--ink-2);margin:0 0 var(--s5);font-size:var(--fs-sm);max-width:62ch}
.course h3{font-size:var(--fs-lg);margin:var(--s6) 0 var(--s3);padding-top:var(--s5);
  border-top:1px solid var(--line);letter-spacing:-.01em}
.course h3:first-of-type{border-top:none;padding-top:0;margin-top:var(--s5)}
.course p{margin:var(--s3) 0;font-size:var(--fs-md);max-width:68ch;line-height:1.7}
.course ul{padding-left:var(--s5);margin:var(--s3) 0;max-width:66ch}
.course li{margin:var(--s2) 0;font-size:var(--fs-md);line-height:1.65}
.course table{width:100%;border-collapse:collapse;margin:var(--s4) 0;font-size:var(--fs-sm)}
.course th,.course td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.course th{background:var(--surface-3);font-weight:650}
.course tr:last-child td{border-bottom:none}
.callout{padding:var(--s3) var(--s4);border-radius:0 var(--r2) var(--r2) 0;
  margin:var(--s4) 0;font-size:var(--fs-base);max-width:68ch;line-height:1.65;
  display:flex;gap:var(--s3);align-items:flex-start}
.callout .ci{font-size:16px;line-height:1.5;flex-shrink:0}
.warn{background:var(--gold-soft);border-left:4px solid var(--gold)}
.key{background:var(--ok-soft);border-left:4px solid var(--ok)}
.heb{background:var(--p-soft);border-radius:var(--r2);padding:var(--s3) var(--s4);
  margin:var(--s5) 0 0;font-size:var(--fs-sm);border-left:4px solid var(--p)}

pre{background:var(--code-bg);color:var(--code-ink);padding:var(--s4) var(--s4);
  border-radius:var(--r2);overflow-x:auto;font-size:13.5px;line-height:1.7;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:var(--s4) 0 var(--s2);
  border:1px solid rgba(255,255,255,.06)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--surface-3);padding:2px 5px;border-radius:5px;font-size:.9em;color:var(--ink)}
pre code{background:none;padding:0;color:inherit;font-size:inherit}

/* ---------- exercice ---------- */
.pbar{height:14px;background:var(--line);border-radius:var(--r-full);overflow:hidden;flex:1;
  min-width:60px}
.pbar>i{display:block;height:100%;background:var(--ok);border-radius:var(--r-full);
  transition:width .45s cubic-bezier(.2,.8,.2,1)}
.hearts{font-size:15px;letter-spacing:2px;white-space:nowrap}
.hearts .h{display:inline-block;transition:transform .3s}
.hearts .h.lost{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1);opacity:.35}}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);
  padding:var(--s5) var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh1);
  animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qtype{font-size:var(--fs-xs);letter-spacing:.09em;text-transform:uppercase;color:var(--p);
  font-weight:700;margin-bottom:var(--s2);display:flex;align-items:center;gap:var(--s2)}
.qtext{font-size:var(--fs-lg);font-weight:650;margin:0;line-height:1.4;letter-spacing:-.01em}
.seqbox{font-family:ui-monospace,monospace;font-size:21px;letter-spacing:.16em;
  background:var(--surface-3);padding:var(--s4);border-radius:var(--r2);margin:var(--s4) 0 var(--s2);
  text-align:center;border:1px solid var(--line)}
.combo{background:var(--gold);color:#fff;font-size:10.5px;font-weight:800;
  padding:3px 9px;border-radius:var(--r-full);letter-spacing:.04em}
[data-theme="dark"] .combo{color:#0e1014}

.choices{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5)}
.choice{
  border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--r2);
  padding:13px 15px;text-align:left;cursor:pointer;font-size:15.5px;font-family:inherit;
  color:var(--ink);display:flex;align-items:center;gap:var(--s3);min-height:52px;
  transition:border-color .12s,background .12s,transform .12s;line-height:1.45;
}
.choice:hover:not(:disabled){border-color:var(--p);background:var(--p-soft);transform:translateX(2px)}
.choice .k{width:28px;height:28px;border:2px solid var(--line-strong);border-radius:var(--r1);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2);flex-shrink:0}
.choice .mark{margin-left:auto;font-size:17px;flex-shrink:0}
.choice.good{border-color:var(--ok);background:var(--ok-soft);animation:goodpop .35s}
.choice.good .k{border-color:var(--ok);color:var(--ok)}
.choice.bad{border-color:var(--ko);background:var(--ko-soft);animation:shake .4s}
.choice.bad .k{border-color:var(--ko);color:var(--ko)}
.choice:disabled{cursor:default}
@keyframes goodpop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.field{margin-top:var(--s5)}
.field label{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);
  margin-bottom:var(--s2)}
input.answer{width:100%;border:2px solid var(--line-strong);border-radius:var(--r2);
  padding:14px 16px;font-size:17px;font-family:ui-monospace,monospace;outline:none;
  background:var(--surface);color:var(--ink);min-height:52px;transition:border-color .15s}
input.answer::placeholder{color:var(--ink-3)}
input.answer:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}
input.answer.good{border-color:var(--ok);background:var(--ok-soft)}
input.answer.bad{border-color:var(--ko);background:var(--ko-soft);animation:shake .4s}
.hint{font-size:var(--fs-xs);color:var(--ink-3);margin-top:var(--s2)}

.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chip{border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--r2);
  padding:11px 14px;cursor:pointer;font-family:ui-monospace,monospace;font-size:13.5px;
  color:var(--ink);transition:border-color .12s,transform .12s;text-align:left;
  white-space:pre;min-height:44px}
.chip:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}
.chip.used{opacity:.28;pointer-events:none}
.slot{min-height:64px;border:2px dashed var(--line-strong);border-radius:var(--r2);
  padding:var(--s2);margin-top:var(--s5);display:flex;flex-direction:column;gap:6px;
  background:var(--surface-2)}
.slot .line{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r1);
  padding:9px 12px;font-family:ui-monospace,monospace;font-size:13px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
  white-space:pre;min-height:40px;animation:slidein .18s}
.slot .line .x{opacity:.55;font-size:11px;flex-shrink:0}
.slot .line:hover .x{opacity:1}
.slot .empty{color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:var(--s3)}

/* ---------- retour immédiat ---------- */
.fb{position:sticky;bottom:0;margin:0 calc(var(--s4) * -1);
  padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));
  border-top:2px solid;animation:up .22s cubic-bezier(.2,.8,.2,1);z-index:20}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.fb.ko{background:var(--ko-soft);border-color:var(--ko-line)}
.fb-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1)}
.fb-head .em{font-size:20px}
.fb h4{margin:0;font-size:var(--fs-md);font-weight:750}
.fb.ok h4{color:var(--ok-ink)} .fb.ko h4{color:var(--ko-ink)}
[data-theme="dark"] .fb.ok h4{color:var(--ok)} [data-theme="dark"] .fb.ko h4{color:var(--ko)}
.fb p{margin:0 0 var(--s4);font-size:15px;line-height:1.6;max-width:66ch}
.fb .sol{font-family:ui-monospace,monospace;font-weight:700}
.fb .row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.xpgain{color:var(--ok);font-weight:750;font-size:var(--fs-sm);animation:floaty .6s}
@keyframes floaty{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- résultat ---------- */
.result{text-align:center;padding:var(--s7) var(--s4);position:relative;overflow:hidden}
.result .big{font-size:60px;margin-bottom:var(--s2);animation:bounce .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.result h2{margin:0 0 var(--s1);font-size:var(--fs-xl);letter-spacing:-.02em}
.result>p{color:var(--ink-2);margin:0 auto var(--s6);max-width:44ch}
.scores{display:flex;gap:var(--s3);justify-content:center;margin-bottom:var(--s6);flex-wrap:wrap}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s4) var(--s5);min-width:104px;box-shadow:var(--sh1)}
.score b{display:block;font-size:var(--fs-xl);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score small{color:var(--ink-2);font-size:var(--fs-xs)}
.actions{display:flex;gap:var(--s3);justify-content:center;flex-wrap:wrap}
.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(560px) rotate(680deg);opacity:0}}

/* ---------- sauvegarde ---------- */
.save h4{margin:0 0 var(--s1);font-size:var(--fs-sm)}
.save p{margin:0 0 var(--s3);font-size:var(--fs-sm);color:var(--ink-2);max-width:60ch}
.save textarea{width:100%;height:56px;border:1px solid var(--line);border-radius:var(--r1);
  padding:var(--s2);font-family:ui-monospace,monospace;font-size:11px;resize:vertical;
  outline:none;background:var(--surface-2);color:var(--ink-2)}
.save .row{display:flex;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.save .btn{padding:10px 16px;font-size:13.5px;min-height:44px;box-shadow:none}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:var(--r-full);
  font-size:14px;font-weight:600;z-index:60;box-shadow:var(--sh3);animation:up .25s;
  max-width:calc(100% - 32px)}

/* ---------- responsive ---------- */
@media(max-width:560px){
  :root{--fs-lg:18px;--fs-xl:22px;--fs-2xl:25px}
  .hero{padding:var(--s5) var(--s4);gap:var(--s4)}
  .ring{width:68px;height:68px}
  .unit,.card{padding:var(--s4)}
  .course{padding:var(--s5) var(--s4)}
  .uprog{width:100%;margin:var(--s2) 0 0;order:3}
  .unit-head{flex-wrap:wrap}
  .node{flex:1 1 auto;justify-content:center}
  .actions .btn,.fb .row .btn{width:100%}
  .scores{gap:var(--s2)}
  .score{padding:var(--s3) var(--s4);min-width:92px;flex:1}
}

/* ---------- mouvement réduit ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .conf{display:none}
}


/* ---------- confort mobile / iPhone ---------- */
body{overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
#app{padding-left:max(var(--s4),env(safe-area-inset-left));
     padding-right:max(var(--s4),env(safe-area-inset-right))}
.topbar{padding-top:max(var(--s3),env(safe-area-inset-top))}
button,.node,.choice,.chip{touch-action:manipulation}
input,textarea{font-size:16px}   /* empêche le zoom automatique de Safari iOS */
@media (display-mode:standalone){
  .topbar{padding-top:max(var(--s5),env(safe-area-inset-top))}
}

/* ---------- lexique hébreu ---------- */
.lexsearch{margin:var(--s3) 0 var(--s2);max-width:100%}
table.lex{font-size:15px}
table.lex td{padding:9px 12px}
.lexgrp th{background:var(--p-soft);color:var(--p-ink);font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;padding:10px 12px}
.lexhe{font-size:19px;font-weight:600;white-space:nowrap;width:34%}
.lexph{color:var(--ink-2);font-style:italic;width:30%}

/* ============================================================
   PASSE DE NETTOYAGE — en-tête sobre, moins d'ornements
   ============================================================ */
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.gstat{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* en-tête : aplat discret au lieu du dégradé */
.hero{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r3);padding:var(--s4) var(--s5);margin-bottom:var(--s3);
  display:flex;align-items:center;gap:var(--s4);box-shadow:var(--sh1);flex-wrap:wrap}
[data-theme="dark"] .hero{background:var(--surface)}
.hero h1{margin:0;font-size:var(--fs-lg);letter-spacing:-.01em;line-height:1.25}
.hero p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.hero-txt{flex:1;min-width:150px}
.ring{width:68px;height:68px;flex-shrink:0;position:relative}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center}
.ring .lab b{font-size:20px;color:var(--ink)}

/* barre de progression globale, fine */
.gbar{height:5px;background:var(--line);border-radius:var(--r-full);overflow:hidden;
  margin:0 var(--s1) var(--s5)}
.gbar>i{display:block;height:100%;background:var(--ok);border-radius:var(--r-full);
  transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* pastille d'unité : le numéro, pas un emoji */
.badge{color:#1b1b20;font-weight:750;font-size:16px;font-variant-numeric:tabular-nums}
.ut{flex:1;min-width:0}

/* carte de révision, compacte */
.revcard{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  background:var(--gold-soft);border-color:var(--gold-line)}
.revcard .txt{flex:1;min-width:150px}
.revcard h3{margin:0;font-size:var(--fs-md)}
.revcard p{margin:1px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}

/* leçons : plus de pastilles grises */
.node{padding:10px 15px;gap:7px}
.node .pc{font-size:12px;opacity:.75}

/* sauvegarde repliée */
details.save{background:transparent;border:none;box-shadow:none;padding:0;margin-top:var(--s5)}
details.save>summary{cursor:pointer;font-size:var(--fs-sm);color:var(--ink-2);
  padding:var(--s3) 0;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details.save>summary::-webkit-details-marker{display:none}
details.save>summary::before{content:"+";font-weight:700;font-size:15px;color:var(--p)}
details.save[open]>summary::before{content:"–"}
details.save>summary:hover{color:var(--ink)}
details.save p{margin:0 0 var(--s3);font-size:var(--fs-sm);color:var(--ink-2);max-width:60ch}

/* correction : marque typographique plutôt qu'emoji */
.fb-head .em{font-size:17px;font-weight:800;line-height:1}
.fb.ok .em{color:var(--ok)} .fb.ko .em{color:var(--ko)}

/* ---------- sections par matière ---------- */
.secttl{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s6) 0 var(--s3);
  font-size:var(--fs-md);letter-spacing:-.01em;padding-bottom:var(--s2);
  border-bottom:1px solid var(--line)}
.secttl:first-of-type{margin-top:var(--s5)}
.secttl>span{flex:1}
.secttl b{font-weight:600;color:var(--ink-2);font-size:14px;margin-left:4px}
.secttl em{font-style:normal;font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- onglets de matière ---------- */
.tabs{display:flex;gap:var(--s1);background:var(--surface-3);border-radius:var(--r2);
  padding:4px;margin-bottom:var(--s4);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;border:none;background:transparent;color:var(--ink-2);
  font-family:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:var(--r1);
  cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .15s,color .15s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab em{font-style:normal;font-size:11.5px;font-weight:700;opacity:.6;
  font-variant-numeric:tabular-nums}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.tab.on em{color:var(--p);opacity:1}
.hero h1 span{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:4px}
.ring .lab b small{font-size:11px;font-weight:600;opacity:.7}

/* ============================================================
   DENSITÉ — liste compacte, moins d'air entre les unités
   (cibles tactiles maintenues au-dessus du minimum WCAG 2.5.8)
   ============================================================ */
.tabs{margin-bottom:var(--s3);padding:3px}
.tab{padding:8px 12px;min-height:40px;font-size:13.5px}
.hero{padding:var(--s3) var(--s4);gap:var(--s3);margin-bottom:var(--s3);border-radius:var(--r2)}
.hero h1{font-size:var(--fs-md)}
.hero p{font-size:13px}
.hero h1 span{font-size:13px}
.ring{width:54px;height:54px}
.ring .lab b{font-size:15px}
.ring .lab b small{font-size:9px}

.unit{padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-radius:var(--r2);box-shadow:none}
.unit-head{margin-bottom:var(--s2);gap:var(--s3)}
.badge{width:32px;height:32px;border-radius:var(--r1);font-size:14px}
.unit h3{font-size:14.5px}
.unit .desc{font-size:12.5px;line-height:1.4;margin-top:0}
.uprog .track{display:none}
.uprog span{font-size:12px;color:var(--ink-3)}
.nodes{gap:6px}
.node{padding:8px 12px;font-size:13px;min-height:38px;border-width:1px;border-radius:var(--r1)}
.node .pc{font-size:11px}
.revcard{padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-radius:var(--r2)}
.revcard h3{font-size:14.5px}
.revcard p{font-size:12.5px}
details.save>summary{font-size:13px;padding:var(--s2) 0;min-height:40px}

@media(max-width:560px){
  .unit .desc{display:none}          /* sur téléphone, le titre suffit */
  .node{flex:0 1 auto}
}

/* titre et description sur une seule ligne */
.ut{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;min-width:0}
.ut h3{white-space:nowrap}
.unit .desc{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.unit{padding:var(--s3) var(--s4) var(--s3)}
.unit-head{margin-bottom:6px}
@media(max-width:560px){ .unit .desc{display:none} }

/* corrections mobile : compteur sur la ligne du titre, onglets tous visibles */
@media(max-width:560px){
  .uprog{width:auto;margin:0;order:0;flex-shrink:0}
  .unit-head{flex-wrap:nowrap;margin-bottom:8px}
  .ut h3{white-space:normal}
  .tab{font-size:12.5px;padding:8px 9px;gap:5px}
  .tab em{font-size:10.5px}
  .hero{padding:var(--s3)}
  .hero .btn{padding:11px 18px;min-height:44px;width:auto;margin-left:auto}
  .badge{width:29px;height:29px;font-size:13px}
}

/* ---------- gros titre de matière ---------- */
.hero{display:block;padding:var(--s4) var(--s5) var(--s4);border-left:5px solid var(--tc);
  border-radius:var(--r2);margin-bottom:var(--s3)}
.hero-top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.hero h1{font-size:clamp(25px,5.2vw,34px);font-weight:800;letter-spacing:-.03em;
  line-height:1.1;margin:0}
.hero .he{font-size:18px;font-weight:600;color:var(--ink-2);opacity:.9}
.hero .ring{margin-left:auto;width:52px;height:52px}
.hero .ring .lab b{font-size:14px;font-weight:750}
.hero .ring .lab b small{font-size:9px}
.hero-go{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s3);flex-wrap:wrap}
.hero-go p{margin:0;flex:1;min-width:140px;font-size:var(--fs-sm);color:var(--ink-2)}
.hero-go .btn{background:var(--tc);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.tab.on{color:var(--tc)}
.tab.on em{color:var(--tc)}
@media(max-width:560px){
  .hero{padding:var(--s3) var(--s4)}
  .hero .he{font-size:15px}
  .hero-go{margin-top:var(--s2)}
  .hero-go .btn{width:100%}
}

/* ============================================================
   CONFORT D'ÉTUDE — lecture, code coloré, respiration
   ============================================================ */
.c-kw{color:#93c5fd;font-weight:600}
.c-fn{color:#f0abfc}
.c-str{color:#86efac}
.c-num{color:#fcd34d}
.c-com{color:#8296ad;font-style:italic}
pre.formule code{color:#e8eaf0}
pre{line-height:1.75;font-size:14px;padding:var(--s4) var(--s5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}

/* --- page de cours : lecture longue --- */
.course{background:#fffefc;padding:var(--s7) var(--s6) var(--s6)}
[data-theme="dark"] .course{background:var(--surface)}
.course h2{font-size:clamp(26px,5vw,33px);letter-spacing:-.03em;line-height:1.15;
  border-left:5px solid var(--tc,var(--p));padding-left:var(--s4);margin-left:calc(var(--s4) * -1)}
.course .lead{font-size:15px;margin-bottom:var(--s4);padding-left:var(--s4);
  margin-left:calc(var(--s4) * -1)}
.course p{font-size:17px;line-height:1.8;max-width:66ch;margin:var(--s4) 0}
.course li{font-size:17px;line-height:1.75}
.course h3{font-size:21px;margin:var(--s7) 0 var(--s3);padding-top:var(--s5);font-weight:700}
.course h3:first-of-type{margin-top:var(--s5)}
.course table{margin:var(--s5) 0;font-size:15px;border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden}
.course th{background:var(--surface-3);font-weight:650;font-size:13.5px;
  text-transform:uppercase;letter-spacing:.04em}
.course tbody tr:nth-child(even){background:var(--surface-2)}
.course td,.course th{padding:11px 14px}
.callout{padding:var(--s4);border-radius:0 var(--r2) var(--r2) 0;font-size:16px;line-height:1.7}
.heb{font-size:15px;line-height:1.9;padding:var(--s4)}
.heb i{color:var(--ink-2);font-size:.95em}

/* --- sommaire du cours --- */
.coursnav{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s4) var(--s5);margin:var(--s5) 0 var(--s6)}
.coursnav .lecture{display:inline-block;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:var(--s2)}
.coursnav ol{margin:0;padding-left:20px;columns:2;column-gap:var(--s6)}
.coursnav li{font-size:14.5px;margin:5px 0;break-inside:avoid}

<!-- ============ CONTENU DES COURS ============ -->
<template id="cours-u1">
<h2>Variables et types</h2>
<p class="lead">Ce qu'il faut savoir avant de faire les 3 leçons de cette unité · correspond aux jours 1 et 2</p>

<h3>1. Afficher quelque chose</h3>
<p>Un programme est une liste d'instructions exécutées dans l'ordre, de haut en bas. La première à connaître affiche du texte :</p>
<pre><code>print("Bonjour")
print("Je commence l'informatique")</code></pre>
<p>Le texte entre guillemets est affiché tel quel. Les deux lignes s'affichent l'une après l'autre.</p>

<h3>2. Les variables</h3>
<p>Une variable est une <b>boîte étiquetée</b> qui garde une valeur en mémoire. On y range une valeur avec le signe <code>=</code> :</p>
<pre><code>age = 15
nom = "David"
taille = 1.72

print(nom)</code></pre>
<div class="callout warn"><span class="ci" aria-hidden="true">⚠️</span><div><b>Le signe <code>=</code> n'est pas l'égalité mathématique.</b> Il signifie « range la valeur de droite dans la boîte de gauche ». C'est pourquoi <code>x = x + 1</code> est parfaitement normal : on prend le contenu de x, on ajoute 1, on remet le résultat dans x.</div></div>

<h3>3. Les types de base</h3>
<table>
<tr><th>Type</th><th>Ce que c'est</th><th>Exemples</th></tr>
<tr><td><code>int</code></td><td>nombre entier</td><td>15, −3, 0</td></tr>
<tr><td><code>float</code></td><td>nombre à virgule</td><td>1.72, −0.5</td></tr>
<tr><td><code>str</code></td><td>texte, toujours entre guillemets</td><td>"David", "15"</td></tr>
</table>
<p><code>15</code> et <code>"15"</code> ne sont pas la même chose : le premier est un nombre avec lequel on calcule, le second est du texte.</p>
<pre><code>print(15 + 15)      # affiche 30
print("15" + "15")  # affiche 1515 (collage de deux textes)</code></pre>
<p>Le symbole <code>#</code> introduit un <b>commentaire</b> : tout ce qui suit sur la ligne est ignoré par la machine. C'est une note pour l'humain.</p>

<h3>4. Demander une information</h3>
<pre><code>nom = input("Comment tu t'appelles ? ")
print("Bonjour " + nom)</code></pre>
<div class="callout warn"><span class="ci" aria-hidden="true">⚠️</span><div><b>Le piège numéro 1 des débutants :</b> <code>input()</code> renvoie <b>toujours</b> du texte, même si l'utilisateur tape un nombre. Pour obtenir un nombre utilisable, il faut convertir :</div></div>
<pre><code>age = int(input("Ton âge ? "))
print("L'an prochain tu auras", age + 1, "ans")</code></pre>
<p>Avec des virgules, <code>print</code> accepte plusieurs éléments de types différents et ajoute une espace entre eux — plus pratique que le <code>+</code>, qui exige que tout soit du texte.</p>

<h3>5. Calculer</h3>
<table>
<tr><th>Opérateur</th><th>Rôle</th><th>Exemple</th><th>Résultat</th></tr>
<tr><td><code>+ − *</code></td><td>opérations usuelles</td><td>7 * 3</td><td>21</td></tr>
<tr><td><code>/</code></td><td>division (donne un float)</td><td>7 / 2</td><td>3.5</td></tr>
<tr><td><code>//</code></td><td><b>division entière</b> : combien de fois ça rentre</td><td>7 // 2</td><td>3</td></tr>
<tr><td><code>%</code></td><td><b>modulo</b> : le reste de la division</td><td>7 % 2</td><td>1</td></tr>
<tr><td><code>**</code></td><td>puissance</td><td>2 ** 10</td><td>1024</td></tr>
</table>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div><b>Pourquoi <code>%</code> est si important.</b> Il répond à des questions qui reviennent sans arrêt : <code>n % 2 == 0</code> teste si n est pair ; <code>347 % 10</code> donne le chiffre des unités (7) ; <code>347 // 10</code> retire le dernier chiffre (34). Cette paire permet de démonter un nombre chiffre par chiffre — un grand classique des examens.</div></div>
<p>Priorités identiques aux mathématiques : puissances, puis <code>* / // %</code>, puis <code>+ −</code>. Les parenthèses forcent l'ordre. Pour arrondir : <code>round(x, 2)</code>.</p>

<h3>6. Lire une erreur</h3>
<p>Un message d'erreur n'est pas une punition, c'est une indication. Toujours lire la dernière ligne et le numéro de ligne signalé. <code>TypeError: can only concatenate str…</code> signifie « tu essaies de coller un nombre à du texte ».</p>
<div class="heb"><b>Vocabulaire :</b> variable = <span dir="rtl" lang="he">משתנה</span> <i>michtané</i> · valeur = <span dir="rtl" lang="he">ערך</span> <i>érekh</i> · type = <span dir="rtl" lang="he">טיפוס</span> <i>tipouss</i> · entrée = <span dir="rtl" lang="he">קלט</span> <i>klat</i> · sortie = <span dir="rtl" lang="he">פלט</span> <i>pélet</i><br><span style="opacity:.8">Les 90 termes sont dans l'unité <b>Vocabulaire hébreu</b>, en bas du parcours.</span></div>
</template>

<template id="cours-u2">
<h2>Les conditions</h2>
<p class="lead">Le premier vrai saut conceptuel : faire prendre des décisions au programme · jours 3 et 4</p>

<h3>1. La structure if</h3>
<pre><code>age = int(input("Ton âge ? "))

if age >= 18:
    print("Tu es majeur")
else:
    print("Tu es mineur")</code></pre>
<div class="callout warn"><span class="ci" aria-hidden="true">⚠️</span><div><b>L'indentation n'est pas décorative : elle fait partie du langage.</b> Les 4 espaces devant <code>print</code> indiquent que cette ligne appartient au <code>if</code>. Une indentation manquante provoque une <code>IndentationError</code>. Et ne jamais oublier les deux-points <code>:</code> en fin de ligne.</div></div>

<h3>2. Comparer</h3>
<table>
<tr><th>Symbole</th><th>Sens</th></tr>
<tr><td><code>==</code></td><td>est égal à — <b>double</b> signe égal ; un seul serait une affectation</td></tr>
<tr><td><code>!=</code></td><td>est différent de</td></tr>
<tr><td><code>&lt; &gt; &lt;= &gt;=</code></td><td>inférieur, supérieur, et leurs versions « ou égal »</td></tr>
</table>
<p>Une comparaison produit un <b>booléen</b> : <code>True</code> ou <code>False</code>. C'est un type à part entière, à côté de int, float et str.</p>
<pre><code>note = 92
reussi = note >= 60
print(reussi)     # True</code></pre>

<h3>3. Plusieurs cas : elif</h3>
<pre><code>if note >= 90:
    print("Excellent")
elif note >= 75:
    print("Bien")
elif note >= 60:
    print("Passable")
else:
    print("Échec")</code></pre>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div>Les conditions sont testées <b>dans l'ordre</b> et le programme s'arrête à la première qui est vraie. C'est pourquoi on écrit les seuils du plus haut au plus bas : en commençant par <code>note >= 60</code>, un 95 afficherait « Passable ». L'ordre n'est pas décoratif, il est logique.</div></div>

<h3>4. Combiner des conditions</h3>
<table>
<tr><th>Opérateur</th><th>Vrai quand</th></tr>
<tr><td><code>and</code></td><td>les <b>deux</b> conditions sont vraies</td></tr>
<tr><td><code>or</code></td><td>au moins <b>une</b> des deux est vraie</td></tr>
<tr><td><code>not</code></td><td>inverse le résultat</td></tr>
</table>
<pre><code>if age >= 15 and moyenne >= 85:
    print("Éligible")</code></pre>
<p>Attention : chaque condition doit être écrite entièrement. <code>if age and moyenne >= 85</code> ne veut pas dire ce qu'on croit.</p>

<h3>5. La méthode, avant de coder</h3>
<p>Avant d'écrire la moindre ligne, répondre par écrit à trois questions : <b>quelles sont les entrées ?</b> <b>quelle est la sortie ?</b> <b>quels sont tous les cas possibles ?</b> Cette étape sur papier est ce qui distingue un élève qui réussit d'un élève qui bloque — et les examinateurs évaluent la logique autant que le code.</p>
<div class="heb"><b>Vocabulaire :</b> condition = <span dir="rtl" lang="he">תנאי</span> <i>tnaï</i> · exécution conditionnelle = <span dir="rtl" lang="he">ביצוע מותנה</span> <i>bitsoua moutné</i> · vrai / faux = <span dir="rtl" lang="he">אמת / שקר</span> <i>émet / chéker</i><br><span style="opacity:.8">Les 90 termes sont dans l'unité <b>Vocabulaire hébreu</b>, en bas du parcours.</span></div>
</template>

<template id="cours-u3">
<h2>Les boucles</h2>
<p class="lead">Le cœur de l'informatique : faire répéter des actions à la machine · jours 5 et 6</p>

<h3>1. La boucle while</h3>
<p><code>while</code> signifie « tant que ». Le bloc indenté se répète tant que la condition reste vraie :</p>
<pre><code>i = 1
while i <= 5:
    print(i)
    i = i + 1
print("Terminé")</code></pre>
<p>i vaut 1 → condition vraie → affiche 1 → i devient 2… jusqu'à i = 6, où la condition devient fausse.</p>
<div class="callout warn"><span class="ci" aria-hidden="true">⚠️</span><div><b>Le piège de la boucle infinie.</b> Si la variable testée n'est jamais modifiée dans la boucle, le programme tourne sans fin. Toute boucle <code>while</code> doit contenir quelque chose qui rapproche de la sortie. Pour arrêter un programme emballé : Ctrl + C.</div></div>

<h3>2. Les trois schémas à connaître par cœur</h3>
<p><b>Le compteur</b> — une variable qui avance d'un pas à chaque tour :</p>
<pre><code>i = 1
while i <= 10:
    print(i)
    i += 1        # raccourci de i = i + 1</code></pre>
<p><b>L'accumulateur</b> — une variable qui grossit à chaque tour :</p>
<pre><code>somme = 0
i = 1
while i <= 100:
    somme += i
    i += 1
print(somme)   # 5050</code></pre>
<p><b>La sentinelle</b> — on répète jusqu'à une valeur d'arrêt :</p>
<pre><code>nombre = int(input("Un nombre (0 pour arrêter) : "))
while nombre != 0:
    total += nombre
    nombre = int(input("Un nombre (0 pour arrêter) : "))</code></pre>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div>Noter la structure de la sentinelle : on lit une première fois <b>avant</b> la boucle, puis on relit <b>à la fin</b> de chaque tour. Sans cette première lecture, la variable testée n'existe pas encore.</div></div>

<h3>3. La boucle for</h3>
<pre><code>for i in range(5):
    print(i)          # 0, 1, 2, 3, 4</code></pre>
<table>
<tr><th>Écriture</th><th>Valeurs parcourues</th></tr>
<tr><td><code>range(5)</code></td><td>0, 1, 2, 3, 4 — <b>la borne finale est exclue</b></td></tr>
<tr><td><code>range(2, 7)</code></td><td>2, 3, 4, 5, 6</td></tr>
<tr><td><code>range(10, 0, -1)</code></td><td>10, 9, 8 … 1 (le 3ᵉ nombre est le pas)</td></tr>
</table>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div><b>for ou while ?</b> Nombre de répétitions connu à l'avance → <code>for</code>. Répétition qui dépend d'un événement (l'utilisateur tape 0, on a trouvé la réponse) → <code>while</code>.</div></div>

<h3>4. Boucles imbriquées</h3>
<p>Une boucle dans une autre : pour <b>chaque</b> tour de la boucle extérieure, la boucle intérieure fait un cycle complet.</p>
<pre><code>for ligne in range(1, 4):
    for colonne in range(1, 4):
        print(ligne * colonne, end="  ")
    print()</code></pre>
<p>Affiche une grille de 3 lignes. <code>end="  "</code> remplace le saut de ligne automatique de <code>print</code>, ce qui permet de rester sur la même ligne. Et <code>"*" * 4</code> répète un texte — pratique pour dessiner des figures.</p>
<div class="heb"><b>Vocabulaire :</b> boucle = <span dir="rtl" lang="he">לולאה</span> <i>loula'a</i> · exécution répétée = <span dir="rtl" lang="he">ביצוע חוזר</span> <i>bitsoua hozer</i> · compteur = <span dir="rtl" lang="he">מונה</span> <i>moné</i> · condition d'arrêt = <span dir="rtl" lang="he">תנאי עצירה</span> <i>tnaï atsira</i><br><span style="opacity:.8">Les 90 termes sont dans l'unité <b>Vocabulaire hébreu</b>, en bas du parcours.</span></div>
</template>

<template id="cours-u4">
<h2>Les fonctions</h2>
<p class="lead">Découper un programme en morceaux réutilisables · jour 8</p>

<h3>1. Définir et appeler</h3>
<pre><code>def dire_bonjour():
    print("Bonjour !")

dire_bonjour()      # appel : exécute le bloc</code></pre>

<h3>2. Avec des paramètres</h3>
<pre><code>def saluer(nom):
    print("Bonjour", nom)

saluer("David")
saluer("Sarah")</code></pre>
<p>Le paramètre <code>nom</code> est une boîte vide, remplie au moment de l'appel.</p>

<h3>3. Avec return — la vraie puissance</h3>
<pre><code>def carre(x):
    return x * x

resultat = carre(7)          # 49
print(carre(3) + carre(4))   # 25</code></pre>
<div class="callout warn"><span class="ci" aria-hidden="true">⚠️</span><div><b>Différence essentielle entre print et return.</b> <code>print</code> affiche à l'écran et le programme n'en garde rien. <code>return</code> <b>renvoie une valeur</b> qu'on peut stocker, réutiliser, combiner. Une fonction de calcul doit presque toujours utiliser <code>return</code> — utiliser <code>print</code> à sa place est une erreur classique aux examens : le résultat s'affiche mais devient inexploitable.</div></div>
<p><code>return</code> met fin immédiatement à la fonction : les lignes situées après ne sont jamais exécutées. Une fonction sans <code>return</code> renvoie <code>None</code>, c'est-à-dire « rien ».</p>
<pre><code>def maximum(a, b):
    if a > b:
        return a
    else:
        return b</code></pre>

<h3>4. Variables locales</h3>
<pre><code>def calcul():
    x = 10        # x n'existe QUE dans la fonction
    return x

calcul()
print(x)          # NameError : x n'existe pas ici</code></pre>
<p>Une variable créée dans une fonction disparaît quand celle-ci se termine. C'est une bonne chose : cela évite que les parties d'un programme s'abîment mutuellement.</p>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div>Une fonction qui répond par oui ou non renvoie un <b>booléen</b> : <code>return True</code> / <code>return False</code>. On peut alors écrire directement <code>if est_premier(n):</code>.</div></div>

<template id="cours-u7">
<h2>Trier et chercher</h2>
<p class="lead">Les algorithmes que tout élève de la filière doit savoir écrire de mémoire · jour 12</p>

<h3>1. Échanger deux éléments</h3>
<pre><code>temp = liste[0]
liste[0] = liste[1]
liste[1] = temp</code></pre>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div>Sans la variable temporaire, la première affectation écraserait la valeur qu'on veut conserver. Python permet aussi <code>a, b = b, a</code>, mais <b>apprendre la version avec temp</b> : c'est celle qui sera exigée en Java, et elle montre qu'on a compris ce qui se passe en mémoire.</div></div>

<h3>2. Le tri par sélection</h3>
<p>Principe : chercher le plus petit élément du reste de la liste et l'amener à sa place.</p>
<pre><code>for i in range(len(liste)):
    indice_min = i
    for j in range(i + 1, len(liste)):
        if liste[j] < liste[indice_min]:
            indice_min = j
    temp = liste[i]
    liste[i] = liste[indice_min]
    liste[indice_min] = temp</code></pre>

<h3>3. Le tri à bulles</h3>
<p>Principe : comparer chaque paire voisine et échanger si elles sont dans le désordre ; répéter jusqu'à ce que plus rien ne bouge. Les grandes valeurs « remontent » vers la fin comme des bulles.</p>
<pre><code>for i in range(n - 1):
    for j in range(n - 1 - i):
        if liste[j] > liste[j + 1]:
            liste[j], liste[j + 1] = liste[j + 1], liste[j]</code></pre>
<p>Optimisation à connaître : s'arrêter dès qu'un passage complet n'a produit aucun échange. Sur une liste déjà triée, on passe de n² à n opérations.</p>

<h3>4. La recherche binaire</h3>
<p>Sur une liste <b>déjà triée</b>, on compare avec l'élément du milieu et on élimine la moitié à chaque étape.</p>
<pre><code>gauche = 0
droite = len(liste) - 1
while gauche <= droite:
    milieu = (gauche + droite) // 2
    if liste[milieu] == cible:
        return milieu
    elif liste[milieu] < cible:
        gauche = milieu + 1
    else:
        droite = milieu - 1
return -1</code></pre>
<div class="callout warn"><span class="ci" aria-hidden="true">⚠️</span><div>La liste <b>doit</b> être triée : sans cela, comparer avec l'élément du milieu ne renseigne sur rien. C'est la condition à ne jamais oublier.</div></div>

<h3>5. L'efficacité</h3>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div>Chercher dans un million d'éléments demande jusqu'à un million de comparaisons en recherche linéaire, contre 20 en recherche binaire. Ordres de grandeur à retenir : <b>boucle simple = n</b>, <b>double boucle = n²</b>, <b>division par deux répétée = log n</b>. Cette intuition suffit pour la première année, et c'est un objectif explicite du programme israélien.</div></div>

<h2>Méthode : les suites</h2>
<p class="lead">Le format le plus fréquent des examens d'entrée — et le seul qui progresse vraiment par l'entraînement</p>

<h3>La méthode, dans l'ordre</h3>
<p>Face à une suite, tester systématiquement, et dans cet ordre :</p>
<ul>
<li><b>Les différences</b> entre termes consécutifs. Constantes → suite arithmétique. Si les différences forment elles-mêmes une suite (8, 7, 6, 5…), c'est la piste.</li>
<li><b>Les rapports</b> : chaque terme divisé par le précédent. Constant → suite géométrique (×2, ÷3…).</li>
<li><b>Une règle mixte</b> : ×2 + 1, ×2 − 2, ×3 + 4. À chercher dès que ni les différences ni les rapports ne parlent.</li>
<li><b>Une alternance</b> : +3, ×2, +3, ×2… ou bien deux suites entrelacées, une pour les termes pairs, une pour les impairs.</li>
<li><b>Les suites à mémoire</b> : chaque terme dépend des <i>deux</i> précédents (Fibonacci : 1, 1, 2, 3, 5, 8).</li>
</ul>

<table>

<tr><td>2, 6, 12, 20, 30</td><td>rectangulaires</td><td>n × (n+1)</td></tr>
<tr><td>1, 2, 6, 24, 120</td><td>factorielles</td><td>×2, ×3, ×4, ×5</td></tr>

<p class="lead">Classements, ensembles, énigmes, problèmes de mouvement — les quatre familles vues dans les sujets réels de Hod Hasharon</p>

<h3>1. Classements sous contraintes</h3>
<p><b>Ne jamais raisonner de tête.</b> Tracer une ligne et y placer les éléments au fur et à mesure. « David a fait mieux que Sarah, Yoni moins bien que Maya mais mieux que David » devient immédiatement : Maya &gt; Yoni &gt; David &gt; Sarah.</p>
<p>Pour les problèmes d'ordre plus complexes (le sujet authentique de Hadarim sur quatre manuels empilés), <b>énumérer tous les arrangements possibles</b> et éliminer ceux qui violent une contrainte. Cinq lignes de tableau valent mieux qu'un quart d'heure de réflexion silencieuse.</p>

<h3>2. Ensembles et diagrammes</h3>
<p>Une seule formule à connaître, et elle sert dans tous les énoncés du type « combien font l'un ou l'autre » :</p>
<div class="callout key"><span class="ci" aria-hidden="true">🔑</span><div><b>|A ∪ B| = |A| + |B| − |A ∩ B|</b><br>Le total de ceux qui font au moins l'une des deux choses = ceux qui font A, plus ceux qui font B, moins ceux qui ont été comptés deux fois.</div></div>
<p>Et pour « combien n'en font aucune » : total général − |A ∪ B|. Dessiner deux cercles qui se croisent et remplir les trois zones en commençant <b>par le milieu</b>.</p>

<h3>3. Énigmes de vérité</h3>
<p>Type « certains disent toujours la vérité, d'autres mentent toujours ». Méthode : <b>faire une hypothèse et la pousser jusqu'à la contradiction</b>. « Si A dit vrai, alors… alors A ment — impossible, donc A ment. » On appelle cela un raisonnement par l'absurde, et c'est exactement la même logique que le <code>not</code> de l'unité 2.</p>

<h3>4. Mouvement, vitesse, travail</h3>
<p>Trois pièges reviennent systématiquement :</p>
<ul>
<li><b>La vitesse moyenne n'est pas la moyenne des vitesses.</b> 60 km/h puis 40 km/h ne donnent pas 50 mais 48 : il faut calculer distance totale ÷ temps total.</li>
<li><b>Vitesse deux fois moindre = durée deux fois plus longue.</b> C'est le sujet authentique de HaShikmim : aller en 3 h, retour à vitesse moitié → 6 h.</li>
<li><b>Les problèmes de travail se raisonnent en « fraction par heure ».</b> Un robinet remplit en 6 h (1/6 par heure), l'autre en 3 h (1/3). Ensemble : 1/2 par heure, donc 2 h.</li>
</ul>
<p>Pour les rencontres de deux mobiles : additionner leurs vitesses de rapprochement, puis diviser la distance par cette somme.</p>

<h2>Géométrie analytique</h2>
<p class="lead">Le plan repéré par des coordonnées · <span dir="rtl" lang="he">הנדסה אנליטית</span> · 10 heures au programme officiel</p>
<h3>1. Les deux formules de base</h3>
<p>Entre deux points A(x₁ ; y₁) et B(x₂ ; y₂) :</p>
<pre><code>Distance :  AB = √((x₂ − x₁)² + (y₂ − y₁)²)
Milieu :    M = ( (x₁+x₂)/2 ; (y₁+y₂)/2 )</code></pre>
<div class="callout key"><span class="ci">🔑</span><div>La formule de la distance <b>est</b> le théorème de Pythagore : on construit le triangle rectangle dont AB est l'hypoténuse.</div></div>
<h3>2. La pente</h3>
<pre><code>m = (y₂ − y₁) / (x₂ − x₁)</code></pre>
<p>Une pente positive monte, une pente négative descend, une pente nulle est horizontale. Une droite verticale n'a <b>pas</b> de pente : la division serait par zéro.</p>
<h3>3. L'équation d'une droite</h3>
<pre><code>y = mx + b</code></pre>
<p>m est la pente, b l'ordonnée à l'origine (là où la droite coupe l'axe des y). Connaissant un point et la pente : y − y₁ = m(x − x₁).</p>
<h3>4. Parallèles et perpendiculaires</h3>
<table>
<tr><th>Position</th><th>Condition</th></tr>
<tr><td>Droites parallèles</td><td>m₁ = m₂</td></tr>
<tr><td>Droites perpendiculaires</td><td>m₁ × m₂ = −1</td></tr>
</table>
<div class="callout warn"><span class="ci">⚠️</span><div>La perpendiculaire ne s'obtient pas en changeant le signe, mais en prenant <b>l'inverse changé de signe</b>. Perpendiculaire à une pente de 2 : −1/2, et non −2.</div></div>

<p>L'ensemble des x pour lesquels la fonction existe. Deux interdits à vérifier systématiquement :</p>
<ul>
<li><b>Pas de division par zéro</b> : pour 1/(x−2), il faut x ≠ 2.</li>
<li><b>Pas de racine carrée d'un nombre négatif</b> : pour √(x−3), il faut x ≥ 3.</li>
</ul>
<h3>2. Points d'intersection avec les axes</h3>
<pre><code>Avec l'axe des y : on calcule f(0)
Avec l'axe des x : on résout f(x) = 0</code></pre>
<h3>3. La parabole</h3>
<p>Pour f(x) = ax² + bx + c :</p>
<table>
<tr><th>Élément</th><th>Règle</th></tr>
<tr><td>Ouverture</td><td>a &gt; 0 : vers le haut (sourire) · a &lt; 0 : vers le bas</td></tr>
<tr><td>Abscisse du sommet</td><td>x = −b / 2a</td></tr>
<tr><td>Ordonnée du sommet</td><td>on remplace ce x dans f</td></tr>
<tr><td>Racines</td><td>discriminant Δ = b² − 4ac, puis x = (−b ± √Δ) / 2a</td></tr>
</table>
<div class="callout key"><span class="ci">🔑</span><div>Le signe du discriminant suffit à savoir combien de solutions existent : Δ &gt; 0 deux racines, Δ = 0 une seule, Δ &lt; 0 aucune.</div></div>
<h3>4. Croissance et décroissance</h3>
<p>Une fonction est croissante (<span dir="rtl" lang="he">עולה</span>) quand la courbe monte de gauche à droite, décroissante (<span dir="rtl" lang="he">יורדת</span>) quand elle descend. Une parabole change de sens exactement à son sommet — c'est la préparation directe au chapitre suivant.</p>
<div class="heb"><b>Vocabulaire :</b> fonction = <span dir="rtl" lang="he">פונקציה</span> <i>founktsia</i> · domaine de définition = <span dir="rtl" lang="he">תחום הגדרה</span> <i>tehoum hagdara</i> · parabole = <span dir="rtl" lang="he">פרבולה</span> <i>parabola</i> · sommet = <span dir="rtl" lang="he">קודקוד</span> <i>kodkod</i> · croissante = <span dir="rtl" lang="he">עולה</span> <i>ola</i></div>
</template>

<template id="cours-m3">
<h2>La dérivée</h2>
<p class="lead">Le plus gros chapitre de l'année · <span dir="rtl" lang="he">חשבון דיפרנציאלי</span> · 45 heures, soit un tiers du programme</p>
<h3>1. Ce que c'est</h3>
<p>La dérivée f′(x) donne <b>la pente de la tangente</b> à la courbe au point d'abscisse x. Autrement dit : à quelle vitesse la fonction monte ou descend à cet endroit précis.</p>
<h3>2. Les règles à connaître par cœur</h3>
<table>
<tr><th>Fonction</th><th>Dérivée</th></tr>
<tr><td>xⁿ</td><td>n·xⁿ⁻¹</td></tr>
<tr><td>constante (5, −3…)</td><td>0</td></tr>
<tr><td>a·f(x)</td><td>a·f′(x)</td></tr>
<tr><td>f(x) + g(x)</td><td>f′(x) + g′(x)</td></tr>
</table>
<pre><code>f(x) = x³        →  f′(x) = 3x²
f(x) = 5x² − 3x + 7  →  f′(x) = 10x − 3
f(x) = x          →  f′(x) = 1</code></pre>
<div class="callout key"><span class="ci">🔑</span><div>La règle unique : <b>l'exposant descend devant, et on lui retire 1</b>. Tout le reste en découle.</div></div>
<h3>3. Équation de la tangente</h3>
<pre><code>y − f(a) = f′(a) · (x − a)</code></pre>
<p>où a est l'abscisse du point de contact. f′(a) donne la pente, f(a) donne le point.</p>
<h3>4. Extremums</h3>
<p>Un maximum ou un minimum se trouve là où <b>la tangente est horizontale</b>, donc là où f′(x) = 0.</p>
<pre><code>1. Calculer f′(x)
2. Résoudre f′(x) = 0
3. Étudier le signe de f′ avant et après
   f′ passe de + à − → maximum
   f′ passe de − à + → minimum</code></pre>
<div class="callout warn"><span class="ci">⚠️</span><div>f′(x) = 0 ne garantit pas un extremum : il faut vérifier que le signe change réellement. Sinon, c'est un simple palier.</div></div>
<div class="heb"><b>Vocabulaire :</b> dérivée = <span dir="rtl" lang="he">נגזרת</span> <i>nigzéret</i> · tangente = <span dir="rtl" lang="he">משיק</span> <i>machik</i> · maximum = <span dir="rtl" lang="he">מקסימום</span> <i>maximoum</i> · point extremum = <span dir="rtl" lang="he">נקודת קיצון</span> <i>nekoudat kitson</i></div>
</template>

<template id="cours-m4">
<h2>Géométrie euclidienne</h2>
<p class="lead">Le cercle et la similitude · <span dir="rtl" lang="he">גאומטריה אוקלידית</span> · 50 heures au total</p>
<h3>1. Les angles dans le cercle</h3>
<table>
<tr><th>Règle</th><th>Énoncé</th></tr>
<tr><td>Angle inscrit</td><td>Un angle inscrit vaut <b>la moitié</b> de l'angle au centre qui intercepte le même arc</td></tr>
<tr><td>Angle sur un diamètre</td><td>Tout angle inscrit qui s'appuie sur un diamètre vaut <b>90°</b></td></tr>
<tr><td>Angles inscrits égaux</td><td>Deux angles inscrits interceptant le même arc sont égaux</td></tr>
<tr><td>Tangente</td><td>La tangente est <b>perpendiculaire au rayon</b> au point de contact</td></tr>
</table>
<div class="callout key"><span class="ci">🔑</span><div>Devant un exercice sur le cercle, chercher d'abord un <b>diamètre</b> : il donne immédiatement un angle droit, donc un triangle rectangle, donc Pythagore.</div></div>
<h3>2. Le théorème de Thalès</h3>
<p>Une droite parallèle à un côté d'un triangle découpe les deux autres côtés en segments proportionnels. C'est l'outil pour transformer un parallélisme en égalité de rapports.</p>
<h3>3. Triangles semblables</h3>
<p>Deux triangles sont semblables (<span dir="rtl" lang="he">דומים</span>) s'ils ont la même forme mais pas la même taille. Trois critères suffisent :</p>
<ul>
<li><b>Deux angles égaux</b> — le critère le plus utilisé, car le troisième suit automatiquement.</li>
<li>Trois côtés proportionnels.</li>
<li>Deux côtés proportionnels et l'angle entre eux égal.</li>
</ul>
<p>Une fois la similitude établie, tous les côtés correspondants sont dans le même rapport — c'est ce rapport qui donne la longueur cherchée.</p>
<div class="callout warn"><span class="ci">⚠️</span><div>Attention à l'<b>ordre des sommets</b> : écrire ABC ~ DEF signifie que A correspond à D, B à E, C à F. Une correspondance inversée fausse tous les rapports.</div></div>
<div class="heb"><b>Vocabulaire :</b> cercle = <span dir="rtl" lang="he">מעגל</span> <i>maagal</i> · rayon = <span dir="rtl" lang="he">רדיוס</span> <i>radious</i> · corde = <span dir="rtl" lang="he">מיתר</span> <i>meïtar</i> · tangente au cercle = <span dir="rtl" lang="he">משיק</span> <i>machik</i> · semblables = <span dir="rtl" lang="he">דומים</span> <i>domim</i> · triangle = <span dir="rtl" lang="he">משולש</span> <i>mechoulach</i></div>
</template>

<template id="cours-m5">
<h2>Trigonométrie</h2>
<p class="lead">Des angles aux longueurs · <span dir="rtl" lang="he">טריגונומטריה</span> · 30 heures</p>
<h3>1. Dans le triangle rectangle</h3>
<pre><code>sin(α) = côté opposé / hypoténuse
cos(α) = côté adjacent / hypoténuse
tan(α) = côté opposé / côté adjacent</code></pre>
<div class="callout key"><span class="ci">🔑</span><div>Le moyen mnémotechnique français : <b>SOH-CAH-TOA</b>. Sinus = Opposé/Hypoténuse, Cosinus = Adjacent/Hypoténuse, Tangente = Opposé/Adjacent.</div></div>
<h3>2. Les valeurs à connaître sans calculatrice</h3>
<table>
<tr><th>α</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr>
<tr><td>sin</td><td>1/2</td><td>√2/2</td><td>√3/2</td><td>1</td></tr>
<tr><td>cos</td><td>√3/2</td><td>√2/2</td><td>1/2</td><td>0</td></tr>
<tr><td>tan</td><td>√3/3</td><td>1</td><td>√3</td><td>—</td></tr>
</table>
<h3>3. L'identité fondamentale</h3>
<pre><code>sin²(α) + cos²(α) = 1</code></pre>
<p>Elle permet de retrouver l'un à partir de l'autre. C'est encore Pythagore, écrit autrement.</p>
<h3>4. Dans un triangle quelconque</h3>
<pre><code>Loi des sinus :    a/sin(A) = b/sin(B) = c/sin(C)
Loi des cosinus :  a² = b² + c² − 2bc·cos(A)</code></pre>
<div class="callout warn"><span class="ci">⚠️</span><div>Comment choisir : la <b>loi des cosinus</b> quand on connaît deux côtés et l'angle entre eux, ou les trois côtés. La <b>loi des sinus</b> dans les autres cas. Et remarquez que si A = 90°, cos(A) = 0 et la loi des cosinus redevient exactement Pythagore.</div></div>
<div class="heb"><b>Vocabulaire :</b> trigonométrie = <span dir="rtl" lang="he">טריגונומטריה</span> <i>trigonométria</i> · angle = <span dir="rtl" lang="he">זווית</span> <i>zavit</i> · hypoténuse = <span dir="rtl" lang="he">יתר</span> <i>yéter</i> · côté = <span dir="rtl" lang="he">צלע</span> <i>tséla</i> · triangle rectangle = <span dir="rtl" lang="he">משולש ישר זווית</span> <i>mechoulach yechar zavit</i></div>
</template>


<template id="cours-p1">
<h2>Cinématique</h2>
<p class="lead">Décrire le mouvement sans se demander pourquoi · <span dir="rtl" lang="he">קינמטיקה</span> · début de la mécanique, 5 <span dir="rtl">יח"ל</span></p>
<h3>1. Les trois grandeurs</h3>
<table>
<tr><th>Grandeur</th><th>Définition</th><th>Unité</th></tr>
<tr><td>Déplacement Δx</td><td>position finale − position initiale</td><td>mètre (m)</td></tr>
<tr><td>Vitesse v</td><td>Δx / Δt</td><td>m/s</td></tr>
<tr><td>Accélération a</td><td>Δv / Δt</td><td>m/s²</td></tr>
</table>
<div class="callout warn"><span class="ci">⚠️</span><div>Le <b>déplacement</b> n'est pas la <b>distance parcourue</b>. Un aller-retour donne un déplacement nul, alors que la distance parcourue, elle, ne l'est pas. Le déplacement est une grandeur orientée.</div></div>
<h3>2. Mouvement uniformément accéléré</h3>
<p>Trois formules couvrent la quasi-totalité des exercices :</p>
<pre><code>v  = v₀ + a·t
x  = x₀ + v₀·t + ½·a·t²
v² = v₀² + 2·a·Δx</code></pre>
<div class="callout key"><span class="ci">🔑</span><div>Comment choisir : si le <b>temps</b> apparaît dans l'énoncé, on prend l'une des deux premières. Si le temps est absent et qu'on parle de <b>distance</b>, c'est la troisième.</div></div>
<h3>3. La chute libre</h3>
<p>Un objet lâché sans vitesse initiale tombe avec l'accélération de la pesanteur, g ≈ 10 m/s² (valeur habituellement retenue dans les exercices israéliens).</p>
<pre><code>v = g·t          hauteur de chute : h = ½·g·t²</code></pre>
<p>Point contre-intuitif mais essentiel : <b>la masse n'intervient pas</b>. Une bille et un boulet lâchés ensemble touchent le sol en même temps, si l'on néglige l'air.</p>
<h3>4. Lire les graphiques</h3>
<table>
<tr><th>Graphique</th><th>Ce que donne la pente</th></tr>
<tr><td>position en fonction du temps</td><td>la vitesse</td></tr>
<tr><td>vitesse en fonction du temps</td><td>l'accélération</td></tr>
<tr><td>vitesse en fonction du temps</td><td>l'<b>aire</b> sous la courbe donne le déplacement</td></tr>
</table>
<div class="heb"><b>Vocabulaire :</b> vitesse = <span dir="rtl" lang="he">מהירות</span> <i>mehirout</i> · accélération = <span dir="rtl" lang="he">תאוצה</span> <i>teoutsa</i> · déplacement = <span dir="rtl" lang="he">העתק</span> <i>hé'étek</i> · chute libre = <span dir="rtl" lang="he">נפילה חופשית</span> <i>nefila hofchit</i> · mécanique = <span dir="rtl" lang="he">מכניקה</span> <i>mekhanika</i></div>
</template>

<template id="cours-p2">
<h2>Les lois de Newton</h2>
<p class="lead">Pourquoi les choses bougent · <span dir="rtl" lang="he">חוקי ניוטון</span> · le cœur de la mécanique</p>
<h3>Première loi — l'inertie</h3>
<p>Un corps sur lequel la <b>somme des forces est nulle</b> garde sa vitesse : il reste immobile, ou continue en ligne droite à vitesse constante.</p>
<div class="callout key"><span class="ci">🔑</span><div>Conséquence qui surprend toujours : <b>maintenir un mouvement ne demande aucune force</b>. Une force ne sert pas à avancer, elle sert à <b>changer</b> la vitesse. S'il faut pousser une caisse en permanence, c'est uniquement pour compenser les frottements.</div></div>
<h3>Deuxième loi — la loi fondamentale</h3>
<pre><code>ΣF = m · a</code></pre>
<p>La force résultante est égale à la masse multipliée par l'accélération. Unité de force : le newton (N). Un newton accélère un kilogramme d'un mètre par seconde carrée.</p>
<h3>Troisième loi — action et réaction</h3>
<p>Si A exerce une force sur B, alors B exerce sur A une force <b>de même intensité et de sens opposé</b>.</p>
<div class="callout warn"><span class="ci">⚠️</span><div>Ces deux forces ne s'annulent jamais entre elles, car <b>elles ne s'appliquent pas au même objet</b> : l'une agit sur A, l'autre sur B. C'est l'erreur la plus fréquente sur ce chapitre.</div></div>
<h3>Les forces à connaître</h3>
<table>
<tr><th>Force</th><th>Expression</th><th>Direction</th></tr>
<tr><td>Poids</td><td>P = m·g</td><td>vers le bas, toujours</td></tr>
<tr><td>Réaction du support (normale)</td><td>N</td><td>perpendiculaire à la surface</td></tr>
<tr><td>Frottement</td><td>f = μ·N</td><td>opposée au mouvement</td></tr>
<tr><td>Tension d'un fil</td><td>T</td><td>le long du fil</td></tr>
</table>
<p><b>Méthode, toujours la même :</b> dessiner l'objet seul, tracer toutes les forces qui s'y appliquent, choisir un axe, projeter, puis écrire ΣF = m·a sur cet axe.</p>
<div class="heb"><b>Vocabulaire :</b> force = <span dir="rtl" lang="he">כוח</span> <i>koah</i> · masse = <span dir="rtl" lang="he">מסה</span> <i>massa</i> · poids = <span dir="rtl" lang="he">משקל</span> <i>michkal</i> · frottement = <span dir="rtl" lang="he">חיכוך</span> <i>hikoukh</i> · inertie = <span dir="rtl" lang="he">התמד</span> <i>hetméd</i></div>
</template>

<template id="cours-p3">
<h2>Travail et énergie</h2>
<p class="lead">Une autre façon de résoudre les mêmes problèmes · <span dir="rtl" lang="he">עבודה ואנרגיה</span></p>
<h3>1. Le travail d'une force</h3>
<pre><code>W = F · d · cos(α)</code></pre>
<p>où α est l'angle entre la force et le déplacement. Unité : le joule (J).</p>
<div class="callout warn"><span class="ci">⚠️</span><div>Une force <b>perpendiculaire</b> au déplacement ne travaille pas : cos(90°) = 0. Porter un sac en marchant horizontalement ne produit aucun travail au sens physique, même si l'on se fatigue.</div></div>
<h3>2. Les deux énergies</h3>
<pre><code>Énergie cinétique :   Eₖ = ½ · m · v²
Énergie potentielle :  Eₚ = m · g · h</code></pre>
<p>La cinétique est l'énergie du mouvement, la potentielle celle de la hauteur.</p>
<div class="callout key"><span class="ci">🔑</span><div>La vitesse est <b>au carré</b> dans l'énergie cinétique : doubler la vitesse quadruple l'énergie. C'est exactement pour cela que la distance de freinage d'une voiture explose avec la vitesse.</div></div>
<h3>3. La conservation de l'énergie</h3>
<p>En l'absence de frottements, la somme reste constante :</p>
<pre><code>Eₖ + Eₚ = constante</code></pre>
<p>Un objet qui tombe convertit sa hauteur en vitesse ; un objet lancé vers le haut fait l'inverse. On peut ainsi trouver une vitesse d'arrivée <b>sans passer par le temps</b> — souvent bien plus rapide que la cinématique.</p>
<h3>4. La puissance</h3>
<pre><code>P = W / t</code></pre>
<p>Unité : le watt (W). C'est la rapidité avec laquelle le travail est fourni : monter un escalier en courant ou en marchant demande le même travail, mais pas la même puissance.</p>
<div class="heb"><b>Vocabulaire :</b> travail = <span dir="rtl" lang="he">עבודה</span> <i>avoda</i> · énergie = <span dir="rtl" lang="he">אנרגיה</span> <i>energia</i> · énergie cinétique = <span dir="rtl" lang="he">אנרגיה קינטית</span> <i>energia kinétit</i> · conservation = <span dir="rtl" lang="he">שימור</span> <i>chimour</i> · puissance = <span dir="rtl" lang="he">הספק</span> <i>hesspek</i></div>
</template>
