/* ===== MATHÉMATIQUES — 5 יח"ל, programme officiel de כיתה י' ===== */
UNITS.push(
{id:'m1',sub:'math',ic:'',col:'#dbeafe',name:'Géométrie analytique',desc:`Distance, pente, équation de droite`,lessons:[
 {name:'Distance et pente',qs:[
  {t:'in',q:`Quelle est la distance entre A(1 ; 2) et B(4 ; 6) ?`,a:['5'],e:`√((4−1)² + (6−2)²) = √(9+16) = √25 = 5. C'est le triangle 3-4-5, à reconnaître d'emblée.`},
  {t:'in',q:`Quelles sont les coordonnées du milieu de A(2 ; 4) et B(8 ; 10) ? Écrivez sous la forme x;y`,a:['5;7','(5;7)','5 ; 7','5,7'],e:`On fait la moyenne des abscisses et celle des ordonnées : (2+8)/2 = 5 et (4+10)/2 = 7.`},
  {t:'in',q:`Quelle est la pente de la droite passant par A(1 ; 3) et B(3 ; 9) ?`,a:['3'],e:`m = (9−3)/(3−1) = 6/2 = 3.`},
  {t:'qcm',q:`Que vaut la pente d'une droite horizontale ?`,c:['0','1','−1',`Elle n'existe pas`],a:0,e:`Horizontale : les y ne changent pas, donc le numérateur est nul. C'est la droite VERTICALE qui n'a pas de pente, car on diviserait par zéro.`},
  {t:'in',q:`Une droite a pour pente 2. Quelle est la pente d'une droite perpendiculaire ? (écrivez sous la forme -1/2)`,a:['-1/2','−1/2','-0.5','−0,5','-0,5'],e:`Le produit des pentes doit valoir −1, donc m = −1/2. Piège classique : ce n'est pas −2.`},
  {t:'qcm',q:`Les droites y = 3x + 1 et y = 3x − 4 sont :`,c:['Perpendiculaires','Parallèles','Confondues','Sécantes en un point'],a:1,e:`Même pente, ordonnées à l'origine différentes : elles ne se croisent jamais.`}
 ]},
 {name:'Équations de droites',qs:[
  {t:'in',q:`Dans y = 4x − 7, quelle est l'ordonnée à l'origine ?`,a:['-7','−7'],e:`C'est b, le terme constant : la droite coupe l'axe des y en (0 ; −7).`},
  {t:'in',q:`Une droite de pente 2 passe par le point (0 ; 5). Quel est son coefficient b ?`,a:['5'],e:`Le point a pour abscisse 0, donc il est exactement l'ordonnée à l'origine.`},
  {t:'in',q:`En quel point la droite y = 2x − 6 coupe-t-elle l'axe des x ? Donnez la valeur de x.`,a:['3'],e:`Sur l'axe des x, y vaut 0 : 2x − 6 = 0, donc x = 3.`},
  {t:'in',q:`La droite y = mx + 1 passe par le point (2 ; 7). Que vaut m ?`,a:['3'],e:`On remplace : 7 = 2m + 1, donc 2m = 6 et m = 3.`},
  {t:'qcm',q:`Quelle droite est perpendiculaire à y = −x + 4 ?`,c:['y = −x − 2','y = x + 5','y = −2x','y = 4x'],a:1,e:`La pente de départ est −1. Il faut m telle que −1 × m = −1, donc m = 1.`},
  {t:'in',q:`Quelle est l'abscisse du point d'intersection de y = 2x et y = x + 3 ?`,a:['3'],e:`On égalise : 2x = x + 3, donc x = 3 (et y = 6).`}
 ]}
]},

{id:'m2',sub:'math',ic:'',col:'#e0f2fe',name:'Les fonctions',desc:`Domaine, paraboles, variations`,lessons:[
 {name:'Domaine et intersections',qs:[
  {t:'in',q:`Quelle valeur de x est interdite pour f(x) = 1/(x − 2) ?`,a:['2'],e:`En x = 2 le dénominateur s'annule : division par zéro impossible.`},
  {t:'qcm',q:`Quel est le domaine de définition de f(x) = √(x − 3) ?`,c:['x > 0','x ≥ 3','x ≤ 3','tous les réels'],a:1,e:`Sous une racine carrée, l'expression doit être positive ou nulle : x − 3 ≥ 0.`},
  {t:'in',q:`Pour f(x) = x² − 5, en quel point la courbe coupe-t-elle l'axe des y ? Donnez l'ordonnée.`,a:['-5','−5'],e:`On calcule f(0) = 0 − 5 = −5.`},
  {t:'in',q:`Quelle est la plus grande racine de f(x) = x² − 4 ?`,a:['2'],e:`x² − 4 = 0 donne x = 2 ou x = −2. La plus grande est 2.`},
  {t:'qcm',q:`La parabole y = −2x² + 3x + 1 est ouverte :`,c:['vers le haut','vers le bas','vers la droite','on ne peut pas savoir'],a:1,e:`Le coefficient a vaut −2, donc négatif : la parabole est tournée vers le bas.`},
  {t:'in',q:`Combien de solutions a l'équation x² + 2x + 5 = 0 ?`,a:['0','aucune','zéro'],e:`Δ = 4 − 20 = −16, négatif : aucune solution réelle. La parabole ne touche jamais l'axe des x.`}
 ]},
 {name:'Sommet et variations',qs:[
  {t:'in',q:`Quelle est l'abscisse du sommet de f(x) = x² − 4x + 3 ?`,a:['2'],e:`x = −b/2a = 4/2 = 2.`},
  {t:'in',q:`Quelle est l'ordonnée du sommet de f(x) = x² − 4x + 3 ?`,a:['-1','−1'],e:`On remplace x = 2 : 4 − 8 + 3 = −1. Le sommet est (2 ; −1).`},
  {t:'in',q:`Quelle est l'abscisse du sommet de f(x) = 2x² − 8x + 1 ?`,a:['2'],e:`x = −b/2a = 8/4 = 2.`},
  {t:'qcm',q:`Pour f(x) = x² − 6x, la fonction est décroissante :`,c:['pour x < 3','pour x > 3','partout','nulle part'],a:0,e:`Le sommet est en x = 3. La parabole est ouverte vers le haut : elle descend avant le sommet, puis remonte.`},
  {t:'in',q:`Quel est le discriminant de x² − 6x + 9 ?`,a:['0'],e:`Δ = 36 − 36 = 0 : une seule racine double, en x = 3. La parabole touche l'axe sans le traverser.`},
  {t:'qcm',q:`Le sommet d'une parabole ouverte vers le haut est :`,c:['un maximum','un minimum','un point d\'inflexion','sans intérêt'],a:1,e:`Ouverte vers le haut, la courbe descend puis remonte : le sommet est le point le plus bas.`}
 ]}
]},

{id:'m3',sub:'math',ic:'',col:'#ede9fe',name:'La dérivée',desc:`45 h au programme — le chapitre central`,lessons:[
 {name:'Calculer une dérivée',qs:[
  {t:'in',q:`Quelle est la dérivée de f(x) = x³ ? (écrivez par exemple 3x^2)`,a:['3x^2','3x²','3x2'],e:`L'exposant descend devant et on lui retire 1 : 3x².`},
  {t:'in',q:`Quelle est la dérivée de f(x) = 5 ?`,a:['0'],e:`Une constante ne varie pas : sa pente est nulle partout.`},
  {t:'in',q:`Quelle est la dérivée de f(x) = 4x ?`,a:['4'],e:`4x est une droite de pente 4 : sa dérivée est 4, quel que soit x.`},
  {t:'in',q:`Quelle est la dérivée de f(x) = 5x² − 3x + 7 ? (écrivez par exemple 10x-3)`,a:['10x-3','10x−3','10x - 3'],e:`Terme par terme : 10x, puis −3, puis 0 pour la constante.`},
  {t:'in',q:`Que vaut f′(2) pour f(x) = x² ?`,a:['4'],e:`f′(x) = 2x, donc f′(2) = 4. C'est la pente de la tangente au point d'abscisse 2.`},
  {t:'in',q:`Quelle est la dérivée de f(x) = x⁴ ? (écrivez par exemple 4x^3)`,a:['4x^3','4x³','4x3'],e:`Toujours la même règle : l'exposant devant, puis diminué de 1.`}
 ]},
 {name:'Tangentes et extremums',qs:[
  {t:'qcm',q:`Que représente f′(a) ?`,c:['La valeur de la fonction en a',`La pente de la tangente au point d'abscisse a`,`L'aire sous la courbe`,`La racine de la fonction`],a:1,e:`C'est toute la signification de la dérivée : une pente locale, à un endroit précis.`},
  {t:'in',q:`Pour f(x) = x² − 6x + 5, quelle est l'abscisse du point extremum ?`,a:['3'],e:`f′(x) = 2x − 6, qui s'annule pour x = 3.`},
  {t:'qcm',q:`Cet extremum de f(x) = x² − 6x + 5 est :`,c:['un maximum','un minimum','ni l\'un ni l\'autre','impossible à déterminer'],a:1,e:`f′ passe de négatif à positif : la courbe descend puis remonte, c'est un minimum. Cohérent avec a > 0.`},
  {t:'in',q:`Quelle est la pente de la tangente à f(x) = x³ au point d'abscisse 1 ?`,a:['3'],e:`f′(x) = 3x², donc f′(1) = 3.`},
  {t:'qcm',q:`En un point où la tangente est horizontale :`,c:['f(x) = 0','f′(x) = 0','f′(x) = 1','la fonction n\'existe pas'],a:1,e:`Tangente horizontale signifie pente nulle, donc dérivée nulle. C'est le point de départ de toute recherche d'extremum.`},
  {t:'in',q:`Pour f(x) = x² − 4x, que vaut f′(0) ?`,a:['-4','−4'],e:`f′(x) = 2x − 4, donc f′(0) = −4 : en ce point la courbe descend.`}
 ]}
]},

{id:'m4',sub:'math',ic:'',col:'#fef3c7',name:'Géométrie euclidienne',desc:`Le cercle, Thalès, triangles semblables`,lessons:[
 {name:'Le cercle',qs:[
  {t:'in',q:`Un angle au centre mesure 80°. Combien mesure l'angle inscrit qui intercepte le même arc ? (en degrés)`,a:['40','40°'],e:`L'angle inscrit vaut la moitié de l'angle au centre.`},
  {t:'in',q:`Un angle inscrit mesure 35°. Combien mesure l'angle au centre correspondant ? (en degrés)`,a:['70','70°'],e:`La relation dans l'autre sens : on double.`},
  {t:'in',q:`Un triangle est inscrit dans un cercle et l'un de ses côtés est un diamètre. Combien mesure l'angle opposé à ce diamètre ? (en degrés)`,a:['90','90°'],e:`C'est la règle la plus rentable de tout le chapitre : un diamètre donne toujours un angle droit.`},
  {t:'qcm',q:`La tangente à un cercle est :`,c:['parallèle au rayon','perpendiculaire au rayon au point de contact','égale au diamètre','une corde particulière'],a:1,e:`D'où un angle droit exploitable dès qu'une tangente apparaît dans un énoncé.`},
  {t:'in',q:`Deux angles inscrits interceptent le même arc. Le premier mesure 48°. Combien mesure le second ? (en degrés)`,a:['48','48°'],e:`Ils sont égaux : même arc, même mesure.`},
  {t:'in',q:`Le rayon d'un cercle vaut 7. Combien vaut le diamètre ?`,a:['14'],e:`Le diamètre est le double du rayon.`}
 ]},
 {name:'Thalès et similitude',qs:[
  {t:'qcm',q:`Quel est le critère de similitude le plus utilisé ?`,c:['Trois côtés égaux','Deux angles égaux','Deux côtés égaux','Un angle droit'],a:1,e:`Deux angles suffisent, puisque le troisième s'en déduit : la somme fait toujours 180°.`},
  {t:'in',q:`Deux triangles sont semblables. Les côtés du premier mesurent 3 et 4 ; le côté correspondant à 3 mesure 6 dans le second. Combien mesure le côté correspondant à 4 ?`,a:['8'],e:`Le rapport est 6/3 = 2, donc 4 × 2 = 8.`},
  {t:'in',q:`Dans un triangle, une droite parallèle à un côté coupe les deux autres. Si AD/DB = 2/3 et AE = 4, combien vaut EC ?`,a:['6'],e:`Thalès : AD/DB = AE/EC, donc 2/3 = 4/EC, d'où EC = 6.`},
  {t:'qcm',q:`Deux triangles semblables ont toujours :`,c:['la même aire','la même forme, mais pas forcément la même taille','les mêmes longueurs','le même périmètre'],a:1,e:`Semblable veut dire proportionnel, pas identique. Identique se dit « superposable ».`},
  {t:'in',q:`Le rapport de similitude entre deux triangles est 3. Le petit a un périmètre de 12. Quel est le périmètre du grand ?`,a:['36'],e:`Toutes les longueurs sont multipliées par 3, donc le périmètre aussi.`},
  {t:'qcm',q:`Si le rapport des côtés est k, le rapport des aires est :`,c:['k','2k','k²','k/2'],a:2,e:`L'aire fait intervenir deux dimensions : doubler les côtés quadruple l'aire.`}
 ]}
]},

{id:'m5',sub:'math',ic:'',col:'#fce7f3',name:'Trigonométrie',desc:`Triangle rectangle, lois des sinus et cosinus`,lessons:[
 {name:'Dans le triangle rectangle',qs:[
  {t:'qcm',q:`Comment se calcule le sinus d'un angle dans un triangle rectangle ?`,c:['adjacent / hypoténuse','opposé / hypoténuse','opposé / adjacent','hypoténuse / opposé'],a:1,e:`SOH : Sinus = Opposé sur Hypoténuse.`},
  {t:'in',q:`Que vaut sin(30°) ? (écrivez 0.5 ou 1/2)`,a:['0.5','1/2','0,5'],e:`Valeur à connaître sans calculatrice.`},
  {t:'in',q:`Que vaut cos(60°) ? (écrivez 0.5 ou 1/2)`,a:['0.5','1/2','0,5'],e:`cos(60°) = sin(30°) : les angles 30 et 60 sont complémentaires, ce qui échange sinus et cosinus.`},
  {t:'in',q:`Que vaut tan(45°) ?`,a:['1'],e:`Dans un triangle rectangle isocèle, opposé et adjacent sont égaux, donc le rapport vaut 1.`},
  {t:'in',q:`Dans un triangle rectangle, le côté opposé mesure 3 et l'hypoténuse 5. Que vaut le sinus de l'angle ? (écrivez 0.6)`,a:['0.6','3/5','0,6'],e:`sin = opposé / hypoténuse = 3/5.`},
  {t:'in',q:`Si sin(α) = 0.6, que vaut sin²(α) + cos²(α) ?`,a:['1'],e:`L'identité fondamentale vaut 1 pour tout angle, quelle que soit la valeur du sinus.`}
 ]},
 {name:'Triangle quelconque',qs:[
  {t:'qcm',q:`Quand utilise-t-on la loi des cosinus ?`,c:['Quand on connaît deux côtés et l\'angle entre eux','Quand on connaît trois angles','Uniquement dans un triangle rectangle','Jamais en classe de י\''],a:0,e:`Elle sert aussi quand on connaît les trois côtés et qu'on cherche un angle.`},
  {t:'qcm',q:`Si A = 90°, la loi des cosinus a² = b² + c² − 2bc·cos(A) devient :`,c:['a² = b² + c²','a = b + c','a² = 2bc','elle ne s\'applique plus'],a:0,e:`cos(90°) = 0, donc le dernier terme disparaît : c'est exactement le théorème de Pythagore. La loi des cosinus en est la généralisation.`},
  {t:'in',q:`Dans un triangle, a = 3, b = 4 et l'angle entre eux vaut 90°. Combien vaut le troisième côté ?`,a:['5'],e:`Angle droit, donc Pythagore : √(9+16) = 5.`},
  {t:'qcm',q:`La loi des sinus s'écrit :`,c:['a·sin(A) = b·sin(B)','a/sin(A) = b/sin(B)','sin(A)/sin(B) = b/a','a + sin(A) = b + sin(B)'],a:1,e:`Chaque côté divisé par le sinus de l'angle opposé donne toujours le même résultat.`},
  {t:'in',q:`Combien font 180° − 45° − 60° ? (l'angle restant d'un triangle, en degrés)`,a:['75','75°'],e:`La somme des angles d'un triangle vaut toujours 180° — le premier réflexe avant toute loi trigonométrique.`},
  {t:'qcm',q:`Dans un triangle quelconque, le plus grand côté est opposé :`,c:['au plus petit angle','au plus grand angle','à l\'angle droit','à aucun angle en particulier'],a:1,e:`Conséquence directe de la loi des sinus : plus l'angle est grand, plus le côté opposé est long.`}
 ]}
]}
);


/* ===== PHYSIQUE — mécanique, 5 יח"ל, כיתה י' (g = 10 m/s²) ===== */
UNITS.push(
{id:'p1',sub:'phys',ic:'',col:'#ccfbf1',name:'Cinématique',desc:`Vitesse, accélération, chute libre`,lessons:[
 {name:'Vitesse et accélération',qs:[
  {t:'in',q:`Une voiture passe de 0 à 20 m/s en 5 s. Quelle est son accélération, en m/s² ?`,a:['4'],e:`a = Δv/Δt = 20/5 = 4 m/s².`},
  {t:'in',q:`Un coureur parcourt 100 m en 10 s. Quelle est sa vitesse moyenne, en m/s ?`,a:['10'],e:`v = Δx/Δt = 100/10 = 10 m/s.`},
  {t:'in',q:`Partant du repos avec a = 2 m/s², quelle distance parcourt-on en 3 s ? (en mètres)`,a:['9'],e:`x = ½·a·t² = ½ × 2 × 9 = 9 m. La vitesse initiale étant nulle, le terme v₀·t disparaît.`},
  {t:'in',q:`Partant du repos avec a = 3 m/s², quelle vitesse atteint-on après 4 s ? (en m/s)`,a:['12'],e:`v = v₀ + a·t = 0 + 3 × 4 = 12 m/s.`},
  {t:'qcm',q:`Une voiture roule à vitesse constante. Que vaut son accélération ?`,c:['Elle est constante et positive','Elle est nulle','Elle est négative','On ne peut pas savoir'],a:1,e:`L'accélération mesure le CHANGEMENT de vitesse. Vitesse constante signifie changement nul.`},
  {t:'qcm',q:`Sur un graphique position-temps, que représente la pente ?`,c:['L\'accélération','La vitesse','La distance','Le temps'],a:1,e:`La pente est Δx/Δt, c'est-à-dire la vitesse. Sur un graphique vitesse-temps, la pente donnerait l'accélération.`}
 ]},
 {name:'Chute libre',qs:[
  {t:'in',q:`Un objet est lâché sans vitesse initiale. Quelle est sa vitesse après 2 s ? (en m/s, avec g = 10)`,a:['20'],e:`v = g·t = 10 × 2 = 20 m/s.`},
  {t:'in',q:`De quelle hauteur tombe-t-il en 2 s ? (en mètres)`,a:['20'],e:`h = ½·g·t² = ½ × 10 × 4 = 20 m.`},
  {t:'qcm',q:`Une bille de 1 kg et une de 5 kg sont lâchées ensemble, sans air. Laquelle arrive en premier ?`,c:['La plus lourde','La plus légère','Elles arrivent ensemble','Cela dépend de la hauteur'],a:2,e:`L'accélération de la pesanteur est la même pour tous les corps : la masse n'intervient pas dans la chute.`},
  {t:'in',q:`Un objet tombe pendant 3 s. Quelle hauteur a-t-il parcourue ? (en mètres, g = 10)`,a:['45'],e:`h = ½ × 10 × 9 = 45 m. Remarquez que le temps est au carré : le triple de temps donne neuf fois la hauteur, pas trois fois.`},
  {t:'qcm',q:`Pendant une chute libre, la vitesse :`,c:['reste constante','augmente régulièrement','diminue','augmente puis diminue'],a:1,e:`Elle augmente de 10 m/s à chaque seconde, puisque l'accélération est constante.`},
  {t:'in',q:`Un objet est lancé vers le haut à 20 m/s. Après combien de secondes s'arrête-t-il en haut ? (g = 10)`,a:['2'],e:`La pesanteur retire 10 m/s par seconde : il faut 2 s pour annuler 20 m/s.`}
 ]}
]},

{id:'p2',sub:'phys',ic:'',col:'#dbeafe',name:'Les lois de Newton',desc:`Forces, masse, frottements`,lessons:[
 {name:'La loi fondamentale',qs:[
  {t:'in',q:`Une force de 10 N s'applique sur une masse de 2 kg. Quelle est l'accélération, en m/s² ?`,a:['5'],e:`a = F/m = 10/2 = 5 m/s².`},
  {t:'in',q:`Quel est le poids d'un objet de 3 kg ? (en newtons, avec g = 10)`,a:['30'],e:`P = m·g = 3 × 10 = 30 N. Attention : la masse est en kilogrammes, le poids en newtons — ce sont deux grandeurs différentes.`},
  {t:'in',q:`Quelle force faut-il pour accélérer 4 kg à 3 m/s² ? (en newtons)`,a:['12'],e:`F = m·a = 4 × 3 = 12 N.`},
  {t:'in',q:`Deux forces opposées de 12 N et 5 N agissent sur un objet. Quelle est la force résultante, en newtons ?`,a:['7'],e:`Opposées, donc on soustrait : 12 − 5 = 7 N, dans le sens de la plus grande.`},
  {t:'qcm',q:`Un objet de 2 kg subit une force résultante nulle. Que fait-il ?`,c:['Il accélère','Il garde sa vitesse (immobile ou en ligne droite)','Il ralentit','Il tombe'],a:1,e:`C'est la première loi. Force nulle ne veut pas dire immobile, mais vitesse inchangée.`},
  {t:'in',q:`Une masse de 5 kg subit une force de 20 N. Quelle est son accélération, en m/s² ?`,a:['4'],e:`a = 20/5 = 4 m/s².`}
 ]},
 {name:'Action, réaction, frottements',qs:[
  {t:'qcm',q:`Vous poussez un mur avec 50 N. Quelle force le mur exerce-t-il sur vous ?`,c:['0 N','25 N','50 N en sens opposé','100 N'],a:2,e:`Troisième loi : même intensité, sens opposé. Le mur vous repousse exactement autant que vous le poussez.`},
  {t:'qcm',q:`Pourquoi ces deux forces ne s'annulent-elles pas ?`,c:['Parce qu\'elles n\'ont pas la même valeur','Parce qu\'elles s\'appliquent à deux objets différents','Parce que le mur est fixe','Parce que le frottement intervient'],a:1,e:`C'est LE point du chapitre : on n'additionne que les forces appliquées au MÊME objet.`},
  {t:'in',q:`Un objet pèse 40 N et le coefficient de frottement vaut 0.2. Quelle est la force de frottement sur un sol horizontal ? (en newtons)`,a:['8'],e:`f = μ·N = 0.2 × 40 = 8 N. Sur un sol horizontal, la normale est égale au poids.`},
  {t:'qcm',q:`Dans quel sens agit la force de frottement ?`,c:['Dans le sens du mouvement','En sens opposé au mouvement','Vers le bas','Vers le haut'],a:1,e:`Elle s'oppose toujours au mouvement — c'est ce qui fait qu'une caisse poussée s'arrête dès qu'on cesse de pousser.`},
  {t:'in',q:`Une caisse est tirée avec 20 N et le frottement vaut 8 N. Quelle est la force résultante, en newtons ?`,a:['12'],e:`20 − 8 = 12 N. C'est cette résultante, et non la force de traction, qu'on met dans ΣF = m·a.`},
  {t:'qcm',q:`Sur un objet posé sur une table, la force normale :`,c:['est parallèle à la table','est perpendiculaire à la table','vaut toujours zéro','est égale au frottement'],a:1,e:`« Normale » signifie perpendiculaire à la surface. Sur une table horizontale, elle est verticale.`}
 ]}
]},

{id:'p3',sub:'phys',ic:'',col:'#fae8ff',name:'Travail et énergie',desc:`Énergie cinétique, potentielle, conservation`,lessons:[
 {name:'Travail et énergies',qs:[

/* ===== Regroupement par matière ===== */
UNITS.forEach(u=>{ if(!u.sub) u.sub = (u.id==='u11') ? 'heb' : 'info'; });
const RANG = {info:0, math:1, phys:2, heb:3};
UNITS.sort((a,b)=> RANG[a.sub] - RANG[b.sub]);
(function(){ const c={}; UNITS.forEach(u=>{ c[u.sub]=(c[u.sub]||0)+1; u.num=c[u.sub]; }); })();
const MATIERES = [
  {k:'info', nom:'Informatique',        he:'מדעי המחשב'},
  {k:'math', nom:'Mathématiques',       he:'מתמטיקה'},
  {k:'phys', nom:'Physique',            he:'פיזיקה'},
  {k:'heb',  nom:'Vocabulaire hébreu',  he:''}
];

/* ================== LEXIQUE ================== */
function filterLex(q){
  q = (q||'').toLowerCase().trim();
  let n = 0;
  document.querySelectorAll('.lexrow').forEach(r=>{
    const ok = !q || r.dataset.k.indexOf(q) > -1 || r.querySelector('.lexhe').textContent.indexOf(q) > -1;
    r.style.display = ok ? '' : 'none';
    if(ok) n++;
  });
  document.querySelectorAll('.lexgrp').forEach(g=>{
    let vis = false, s = g.nextElementSibling;
    while(s && s.classList.contains('lexrow')){ if(s.style.display !== 'none') vis = true; s = s.nextElementSibling; }
    g.style.display = vis ? '' : 'none';
  });
  const c = document.getElementById('lexcount'); if(c) c.textContent = n + (n>1?' termes affichés':' terme affiché');
  const v = document.getElementById('lexvide'); if(v) v.style.display = n ? 'none' : '';
}

/* ================== ÉTAT ================== */
let S = {xp:0, done:{}, read:{}, wrong:[], theme:null};
let L = null;

const $ = h => { const d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => String(s).toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,;!]$/,'');
const app = () => document.getElementById('app');
const lvl = () => Math.floor(S.xp/100)+1;
const totalLessons = () => UNITS.reduce((n,u)=>n+u.lessons.length,0);
const doneCount = () => Object.keys(S.done).length;

/* ================== THÈME ================== */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  const dark = S.theme ? S.theme==='dark'
    : window.matchMedia('(prefers-color-scheme:dark)').matches;
  S.theme = dark ? 'light' : 'dark';
  applyTheme();
  const v = document.querySelector('#app').getAttribute('data-view');
  if(v==='home') home(); else if(v==='course') openCourse(lastCourse[0],lastCourse[1]);
  toast(S.theme==='dark' ? 'Mode sombre activé' : 'Mode clair activé');
}
function themeBtn(){
  const dark = S.theme ? S.theme==='dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
  return `<button class="iconbtn" onclick="toggleTheme()"
    aria-label="${dark?'Passer en mode clair':'Passer en mode sombre'}">${dark?'☀️':'🌙'}</button>`;
}

/* ================== UTILITAIRES ================== */
let toastT = null;
function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = $(`<div class="toast" role="status">${msg}</div>`);
  document.body.appendChild(t);
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.remove(), 2600);
}
function ring(pct,size){
  const r = size/2 - 5, c = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line-strong)" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--p)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/>
  </svg>`;
}
function nextStep(){
  for(let ui=0; ui<UNITS.length; ui++){
    const u = UNITS[ui];
    if(!S.read[u.id]) return {type:'cours', ui, label:'Cours — '+u.name};
    for(let li=0; li<u.lessons.length; li++)
      if(!S.done[ui+'-'+li]) return {type:'lecon', ui, li, label:u.name+' · '+u.lessons[li].name};
  }
  return null;
}

/* ================== ACCUEIL ================== */
function home(){
  const pct = S.xp % 100;
  const globalPct = Math.round(doneCount()/totalLessons()*100);
  const nx = nextStep();
  const action = nx ? (nx.type==='cours'
      ? `openCourse('${UNITS[nx.ui].id}',${nx.ui})` : `start(${nx.ui},${nx.li})`) : '';

  let h = `<header class="topbar">
    <span class="brand">Supercode</span>
    <div class="spacer"></div>
    <span class="gstat">${doneCount()} / ${totalLessons()} leçons</span>
    ${themeBtn()}
  </header>
  <main>
  <section class="hero">
    <div class="ring">${ring(pct,68)}<div class="lab"><b>${lvl()}</b></div></div>
    <div class="hero-txt">
      <h1>CodeTrainer</h1>
      <p>${nx ? nx.label : 'Parcours terminé — reprenez les leçons sous 100 %'}</p>
    </div>
    ${nx ? `<button class="btn btn-p" onclick="${action}">${nx.type==='cours'?'Lire le cours':'Continuer'}</button>` : ''}
  </section>
  <div class="gbar" role="progressbar" aria-valuenow="${globalPct}" aria-valuemin="0"
    aria-valuemax="100" aria-label="Progression globale"><i style="width:${globalPct}%"></i></div>`;

  if(S.wrong.length){
    h += `<section class="card revcard">
      <div class="txt"><h3>Réviser mes erreurs</h3>
        <p>${S.wrong.length} question${S.wrong.length>1?'s':''} mise${S.wrong.length>1?'s':''} de côté</p></div>
      <button class="btn btn-sec" onclick="startReview()">Réviser</button>
    </section>`;
  }

  MATIERES.forEach(mat=>{
    const idx = UNITS.map((u,i)=>[u,i]).filter(p=>p[0].sub===mat.k);
    if(!idx.length) return;
    const tot = idx.reduce((n,p)=>n+p[0].lessons.length,0);
    const fait = idx.reduce((n,p)=>n+p[0].lessons.filter((_,li)=>S.done[p[1]+'-'+li]).length,0);
    h += `<h2 class="secttl"><span>${mat.nom}${mat.he?' <b dir="rtl" lang="he">'+mat.he+'</b>':''}</span>
      <em>${fait}/${tot}</em></h2>`;

    idx.forEach(([u,ui])=>{
      const dn = u.lessons.filter((_,li)=>S.done[ui+'-'+li]).length;
      const up = Math.round(dn/u.lessons.length*100);
      const isNext = nx && nx.ui===ui;
      h += `<section class="unit" aria-labelledby="u${ui}t">
        <div class="unit-head">
          <div class="badge" style="background:${u.col}" aria-hidden="true">${u.num}</div>
          <div class="ut"><h3 id="u${ui}t">${u.name}</h3><p class="desc">${u.desc}</p></div>
          <div class="uprog"><div class="track"><i style="width:${up}%"></i></div>
            <span>${dn}/${u.lessons.length}</span></div>
        </div>
        <div class="nodes">
          <button class="node cours ${S.read[u.id]?'read':''} ${isNext&&nx.type==='cours'?'next':''}"
            onclick="openCourse('${u.id}',${ui})">Cours</button>`;
      u.lessons.forEach((ls,li)=>{
        const d = S.done[ui+'-'+li];
        const nxt = isNext && nx.type==='lecon' && nx.li===li;
        h += `<button class="node ${d?'done':''} ${nxt?'next':''}" onclick="start(${ui},${li})"
          aria-label="${ls.name}${d?', terminée à '+d+' pour cent':', non commencée'}">
          ${ls.name}${d?'<span class="pc">'+d+'%</span>':''}</button>`;
      });
      h += `</div></section>`;
    });
  });

  h += `<details class="save">
    <summary>Sauvegarder ou restaurer ma progression</summary>
    <p>La progression ne vit que le temps de la session. Copiez ce code et recollez-le à la prochaine ouverture.</p>
    <label class="sr" for="code">Code de progression</label>
    <textarea id="code" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
    <div class="row">
      <button class="btn btn-sec" onclick="copyCode()">Copier</button>
      <button class="btn btn-ghost" onclick="loadCode()">Charger un code…</button>
    </div>
  </details></main>`;

  app().setAttribute('data-view','home');
  app().innerHTML = h;
  window.scrollTo(0,0);
}

function copyCode(){
  const t = document.getElementById('code'); t.select(); t.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); toast('Code copié — conservez-le pour reprendre plus tard'); }
  catch(e){ toast('Sélectionnez le texte et copiez-le manuellement'); }
}
function loadCode(){
  const v = prompt('Collez votre code de progression :');
  if(!v) return;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(v.trim()))));
    if(typeof o.xp === 'number'){
      S = Object.assign({xp:0,done:{},read:{},wrong:[],theme:null}, o);
      applyTheme(); home(); toast('Progression restaurée');
    } else toast('Code non reconnu');
  }catch(e){ toast('Code non reconnu'); }
}

/* ================== VUE COURS ================== */
let lastCourse = [null,0];
function openCourse(id, ui){
  const tpl = document.getElementById('cours-'+id);
  if(!tpl) return;
  S.read[id] = 1; lastCourse = [id,ui];
  const u = UNITS[ui];
  const prev = UNITS[ui-1], next = UNITS[ui+1];

  app().setAttribute('data-view','course');
  app().innerHTML = `<div class="readbar" id="rb"></div>
    <header class="topbar">
      <button class="btn btn-ghost" onclick="home()">← Parcours</button>
      <div class="spacer"></div>
      <span class="gstat">Unité ${ui+1} / ${UNITS.length}</span>
      ${themeBtn()}
    </header>
    <main><article class="course">${tpl.innerHTML}</article>
    <div class="actions" style="justify-content:flex-start;margin:var(--s5) 0 var(--s3)">
      <button class="btn btn-p" onclick="start(${ui},0)">Passer aux exercices</button>
      <button class="btn btn-ghost" onclick="home()">Retour au parcours</button>
    </div>
    <p style="color:var(--ink-2);font-size:14px;margin:0 0 var(--s5)">
      ${u.lessons.length} série${u.lessons.length>1?'s':''} d'exercices sur cette unité — le cours reste accessible à tout moment.</p>
    <nav class="nodes" aria-label="Navigation entre unités">
      ${prev?`<button class="node" onclick="openCourse('${prev.id}',${ui-1})">← ${prev.name}</button>`:''}
      ${next?`<button class="node" onclick="openCourse('${next.id}',${ui+1})">${next.name} →</button>`:''}
    </nav></main>`;

  window.scrollTo(0,0);
  window.onscroll = ()=>{
    const rb = document.getElementById('rb'); if(!rb) return;
    const max = document.body.scrollHeight - window.innerHeight;
    rb.style.width = (max>0 ? Math.min(100, window.scrollY/max*100) : 0) + '%';
  };
}

/* ================== LEÇON ================== */
function start(ui,li){
  window.onscroll = null;
  const ls = UNITS[ui].lessons[li];
  L = {qs:ls.qs.slice(), i:0, hearts:3, ok:0, combo:0, key:ui+'-'+li,
       title:ls.name, unit:UNITS[ui].name, ui:ui, li:li, review:false};
  render();
}
function startReview(){
  window.onscroll = null;
  L = {qs:S.wrong.slice(0,10), i:0, hearts:3, ok:0, combo:0, key:null,
       title:'Révision', unit:'Mes erreurs', review:true};
  S.wrong = S.wrong.slice(10);
  render();
}

function hearts(){
  let s = '';
  for(let i=0;i<3;i++) s += `<span class="h" aria-hidden="true">${i<L.hearts?'❤️':'🤍'}</span>`;
  return s;
}

function render(){
  const q = L.qs[L.i];
  const pct = (L.i / L.qs.length) * 100;
  const labels = {qcm:'Choix multiple', in:'Réponse à saisir', ord:'Remise en ordre'};

  let h = `<header class="topbar">
    <button class="iconbtn" onclick="quit()" aria-label="Quitter la leçon">✕</button>
    <div class="pbar" role="progressbar" aria-valuenow="${Math.round(pct)}"
      aria-valuemin="0" aria-valuemax="100" aria-label="Progression dans la leçon">
      <i style="width:${pct}%"></i></div>
    <div class="hearts" id="hz">${hearts()}</div>
    <span class="sr" id="hlab">${L.hearts} vie${L.hearts>1?'s':''} restante${L.hearts>1?'s':''}</span>
  </header>
  <main>
  <section class="qcard">
    <p class="qtype">${labels[q.t]} · question ${L.i+1} sur ${L.qs.length}
      ${L.combo>=3?'<span class="combo">série ×'+L.combo+'</span>':''}</p>
    <h2 class="qtext">${q.q}</h2>`;
  if(q.code) h += `<pre><code>${esc(q.code)}</code></pre>`;
  if(q.seq)  h += `<div class="seqbox">${q.seq}</div>`;

  if(q.t==='qcm'){
    if(!q._order) q._order = q.c.map((_,i)=>i).sort(()=>Math.random()-.5);
    h += `<div class="choices" id="ch">`;
    q._order.forEach((oi,pos)=>{
      h += `<button class="choice" onclick="answerQcm(${oi},this)">
        <span class="k" aria-hidden="true">${'ABCD'[pos]}</span><span>${q.c[oi]}</span></button>`;
    });
    h += `</div><p class="hint">Astuce clavier : touches 1 à ${q.c.length} pour répondre.</p>`;
  } else if(q.t==='in'){
    h += `<div class="field">
      <label for="inp">Votre réponse</label>
      <input class="answer" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"
        inputmode="text" placeholder="Tapez ici…" onkeydown="if(event.key==='Enter')answerIn()">
      <p class="hint">Validez avec la touche Entrée.</p>
    </div>
    <div style="margin-top:var(--s4)"><button class="btn btn-p" id="valid" onclick="answerIn()">Valider</button></div>`;
  } else if(q.t==='ord'){
    if(!q._shuf) q._shuf = q.items.map((v,i)=>i).sort(()=>Math.random()-.5);
    L.built = [];
    h += `<div class="slot" id="slot" aria-live="polite">
        <div class="empty">Cliquez les lignes dans le bon ordre</div></div>
      <div class="chips" id="chips">`;
    q._shuf.forEach(i=>{ h += `<button class="chip" data-i="${i}" onclick="pick(${i},this)">${esc(q.items[i])}</button>`; });
    h += `</div><div style="margin-top:var(--s4)">
      <button class="btn btn-p" id="valid" onclick="answerOrd()" disabled>Valider</button></div>`;
  }
  h += `</section></main><div id="fbz" aria-live="polite"></div>`;

  app().setAttribute('data-view','lesson');
  app().innerHTML = h;
  const inp = document.getElementById('inp'); if(inp) inp.focus();

  document.onkeydown = e=>{
    if(q.t==='qcm' && /^[1-9]$/.test(e.key)){
      const b = document.querySelectorAll('#ch .choice')[+e.key-1];
      if(b && !b.disabled) b.click();
    }
  };
}

function pick(i,el){
  L.built.push(i); el.classList.add('used');
  paintSlot();
  document.getElementById('valid').disabled = L.built.length !== L.qs[L.i].items.length;
}
function unpick(pos){
  const i = L.built.splice(pos,1)[0];
  const c = document.querySelector('.chip[data-i="'+i+'"]'); if(c) c.classList.remove('used');
  paintSlot();
  document.getElementById('valid').disabled = true;
}
function paintSlot(){
  const q = L.qs[L.i], slot = document.getElementById('slot');
  slot.innerHTML = L.built.length
    ? L.built.map((b,p)=>`<div class="line" onclick="unpick(${p})" role="button" tabindex="0"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();unpick(${p})}"
        >${esc(q.items[b])}<span class="x">retirer</span></div>`).join('')
    : '<div class="empty">Cliquez les lignes dans le bon ordre</div>';
}

function answerQcm(i,el){
  const q = L.qs[L.i], good = i===q.a;
  document.querySelectorAll('#ch .choice').forEach(b=>b.disabled=true);
  el.classList.add(good?'good':'bad');
  el.insertAdjacentHTML('beforeend',`<span class="mark" aria-hidden="true">${good?'✓':'✕'}</span>`);
  if(!good){
    const c = document.querySelectorAll('#ch .choice')[q._order.indexOf(q.a)];
    c.classList.add('good');
    c.insertAdjacentHTML('beforeend','<span class="mark" aria-hidden="true">✓</span>');
  }
  judge(good, q.c[q.a]);
}
function answerIn(){
  const q = L.qs[L.i], inp = document.getElementById('inp');
  if(!inp || inp.disabled || !inp.value.trim()) return;
  const good = q.a.some(x=>norm(x)===norm(inp.value));
  inp.disabled = true; inp.classList.add(good?'good':'bad');
  document.getElementById('valid').disabled = true;
  judge(good, q.a[0]);
}
function answerOrd(){
  const q = L.qs[L.i], good = L.built.every((v,i)=>v===i);
  document.querySelectorAll('.chip').forEach(c=>c.disabled=true);
  document.querySelectorAll('.slot .line').forEach(l=>l.onclick=null);
  document.getElementById('valid').disabled = true;
  judge(good, q.items.join('  →  '));
}

function judge(good, sol){
  const q = L.qs[L.i];
  let gain = 0;
  if(good){
    L.ok++; L.combo++;
    gain = 10 + (L.combo>=5 ? 5 : 0);
    S.xp += gain;
  } else {
    L.combo = 0; L.hearts--;
    if(!S.wrong.some(w=>w.q===q.q)) S.wrong.push(q);
    const hz = document.getElementById('hz');
    if(hz){
      const h = hz.querySelectorAll('.h')[L.hearts];
      if(h){ h.classList.add('lost'); setTimeout(()=>{h.textContent='🤍';},220); }
      const lab = document.getElementById('hlab');
      if(lab) lab.textContent = L.hearts + ' vie' + (L.hearts>1?'s':'') + ' restante' + (L.hearts>1?'s':'');
    }
  }
  const fb = $(`<div class="fb ${good?'ok':'ko'}" role="status">
    <div class="fb-head"><span class="em" aria-hidden="true">${good?'✓':'✕'}</span>
      <h4>${good ? (L.combo>=5 ? 'Excellent — série de '+L.combo : 'Bonne réponse') : 'Réponse incorrecte'}</h4></div>
    <p>${good?'':'<b>La bonne réponse était : <span class="sol">'+esc(sol)+'</span></b><br>'}${q.e}</p>
    <div class="row">
      <button class="btn ${good?'btn-g':'btn-p'}" id="cont" onclick="next()">Continuer</button>
      ${gain?'<span class="xpgain">+'+gain+' XP</span>':''}
    </div>
  </div>`);
  document.getElementById('fbz').appendChild(fb);
  fb.scrollIntoView({behavior:'smooth',block:'end'});
  document.getElementById('cont').focus({preventScroll:true});
  document.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); next(); } };
}

function next(){
  document.onkeydown = null;
  if(L.hearts<=0) return result(false);
  L.i++;
  if(L.i >= L.qs.length) return result(true);
  render(); window.scrollTo(0,0);
}
function quit(){ document.onkeydown=null; window.onscroll=null; L=null; home(); }

function result(win){
  const pct = Math.round(L.ok/L.qs.length*100);
  let bonus = 0;
  if(win && L.key){
    if(pct > (S.done[L.key]||0)) S.done[L.key] = pct;
    if(pct===100){ bonus = 20; S.xp += 20; }
  }
  const perfect = win && pct===100;
  const conf = perfect ? Array.from({length:16},(_,i)=>
    `<span class="conf" style="left:${6+i*6}%;background:${['#4f46e5','#16a34a','#f59e0b','#ec4899'][i%4]};animation-delay:${i*.09}s"></span>`).join('') : '';

  app().setAttribute('data-view','result');
  app().innerHTML = `<main class="result">${conf}
    <div class="big" aria-hidden="true">${perfect?'🏆':win?'🎉':'💪'}</div>
    <h2>${perfect?'Sans faute':win?'Leçon terminée':'Plus de vies'}</h2>
    <p>${perfect ? 'Aucune erreur sur cette série. Bonus de 20 XP.'
        : win ? 'Les questions ratées ont été mises de côté dans « Réviser mes erreurs ».'
        : 'Reprenez la leçon — les questions ratées reviendront en révision.'}</p>
    <div class="scores">
      <div class="score"><b>${L.ok}/${L.qs.length}</b><small>bonnes réponses</small></div>
      <div class="score"><b>${pct}%</b><small>réussite</small></div>
      <div class="score"><b>${S.xp}</b><small>XP total</small></div>
    </div>
    <div class="actions">
      <button class="btn btn-p" onclick="home()">Retour au parcours</button>
      ${L.key!==null&&L.key!==undefined ? `<button class="btn btn-sec" onclick="start(${L.ui},${L.li})">Refaire la leçon</button>` : ''}
    </div></main>`;
  window.scrollTo(0,0);
}

applyTheme();
home();

</script>
<script>
/* Mode hors ligne — actif uniquement en https (GitHub Pages).
   En ouvrant le fichier depuis le disque, l'application marche déjà sans connexion. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
